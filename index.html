<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WebScan – WordPress LAB FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0b1220;--panel:#121a2c;--text:#e9efff;--accent:#4f7cff}
.light{--bg:#f4f6fb;--panel:#ffffff;--text:#0b1220;--accent:#3b6cff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text);display:flex;height:100vh}
.sidebar{width:260px;background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:10px}
.sidebar h2{margin:0}
.sidebar button{padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;cursor:pointer}
.sidebar .ghost{background:transparent;color:var(--text);border:1px solid var(--accent)}
.main{flex:1;padding:24px;overflow:auto}
.card{background:var(--panel);border-radius:18px;padding:18px;margin-bottom:16px}
input{width:100%;padding:12px;border-radius:10px;border:none;margin-bottom:8px}
pre{background:#0a1020;color:#cde;padding:16px;border-radius:14px;white-space:pre-wrap}
.light pre{background:#eef2ff;color:#111}
</style>
</head>

<body>
<div class="sidebar">
  <h2>🛡️ ORCA</h2>
  <button onclick="scan()">Scan Target</button>
  <button class="ghost" onclick="toggleBrute()">Brute Force LAB</button>
  <button class="ghost" onclick="rceValidate()">RCE Validation</button>
  <button class="ghost" onclick="toggleTheme()">🌗 Theme</button>
</div>

<div class="main">
  <h1>ORCA WebScan – WordPress LAB</h1>

  <div class="card">
    <input id="target" placeholder="https://example.com (ENTER)">
  </div>

  <div class="card" id="brute" style="display:none">
    <input id="loginUrl" placeholder="/wp-login.php">
    <input id="singleUser" placeholder="Username (optional)">
    <input type="file" id="userWL">
    <input id="singlePass" placeholder="Password (optional)">
    <input type="file" id="passWL">
    <button onclick="runBrute()">Run Brute Simulation</button>
  </div>

  <div class="card">
    <pre id="out">Idle.</pre>
  </div>
</div>

<script>
/* ========= CORE ========= */
const out=t=>document.getElementById("out").textContent=t;
const add=t=>out(document.getElementById("out").textContent+t+"\n");
const target=document.getElementById("target");
target.addEventListener("keydown",e=>{if(e.key==="Enter")scan();});
function toggleTheme(){document.body.classList.toggle("light");}
function toggleBrute(){brute.style.display=brute.style.display==="none"?"block":"none";}
async function fetchSafe(u){try{return await fetch(u);}catch{return null;}}

/* ========= PLUGIN DB ========= */
const pluginDB={
  "revslider":["CVE-2014-9734"],
  "wp-file-manager":["CVE-2020-25213"],
  "elementor":["CVE-2023-48777"],
  "woocommerce":[],
  "contact-form-7":[]
};
const cveInfo={
  "CVE-2014-9734":"RevSlider file upload RCE",
  "CVE-2020-25213":"WP File Manager unauthenticated RCE",
  "CVE-2023-48777":"Elementor template import RCE"
};

/* ========= SCAN ========= */
async function scan(){
  const base=target.value.replace(/\/$/,"");
  if(!base)return;
  out("Scanning...\n");

  const home=await fetchSafe(base);
  if(!home){out("Target unreachable");return;}
  const html=await home.text();

  add("Target\n------\n"+base+"\n");

  /* Server / CDN */
  add("Server / CDN\n------------");
  const server=home.headers.get("server")||"Hidden";
  add(server);
  if(home.headers.get("cf-ray")) add("Cloudflare detected");
  add("");

  /* cdn-cgi trace */
  const trace=await fetchSafe(base+"/cdn-cgi/trace");
  if(trace && trace.status===200){
    add("Cloudflare Trace\n-----------------");
    add(await trace.text());
  }

  /* WordPress */
  add("\nWordPress\n---------");
  add(/wp-content|wp-includes/i.test(html)?"Detected":"Not detected");

  /* USERS enum */
  await enumUsers(base);

  /* Plugin auto-detect */
  await detectPlugins(base,html);

  add("\nScan completed.");
}

/* ========= USER ENUM ========= */
async function enumUsers(base){
  add("\nUsers (Merged)\n--------------");
  const users=new Map();

  const rest=await fetchSafe(base+"/wp-json/wp/v2/users");
  if(rest && rest.status===200){
    try{
      const d=await rest.json();
      d.forEach(u=>users.set(u.slug,{slug:u.slug,source:"REST"}));
    }catch{}
  }

  for(let i=1;i<=5;i++){
    const r=await fetchSafe(base+"/?author="+i);
    if(r && r.redirected){
      const m=r.url.match(/\/author\/([^\/]+)/);
      if(m){
        const slug=m[1];
        if(users.has(slug)) users.get(slug).source+="+AUTHOR";
        else users.set(slug,{slug,source:"AUTHOR"});
      }
    }
  }

  users.forEach(u=>{
    add(`- ${u.slug} (${u.source})`);
  });

  if(!users.size) add("No users exposed");
}

/* ========= PLUGIN AUTO DETECT ========= */
async function detectPlugins(base,html){
  add("\nPlugins (Auto-detect)\n---------------------");

  const found=[...new Set(
    [...html.matchAll(/wp-content\/plugins\/([a-z0-9-_]+)/gi)].map(m=>m[1])
  )];

  if(!found.length){add("No plugin detected");return;}

  for(const p of found){
    let confidence="LOW";
    const path=await fetchSafe(base+"/wp-content/plugins/"+p+"/");
    if(path && path.status===200) confidence="HIGH";
    else confidence="MEDIUM";

    add(`Plugin : ${p}`);
    add(`Confidence : ${confidence}`);

    if(pluginDB[p]){
      pluginDB[p].forEach(c=>{
        add(`CVE : ${c} → ${cveInfo[c]||"Info unavailable"}`);
      });
    }
    add("");
  }
}

/* ========= RCE VALIDATION ========= */
async function rceValidate(){
  const base=target.value.replace(/\/$/,"");
  if(!base)return;
  out("RCE Validation (SAFE)\n");
  const tests=["/?cmd=id","/?exec=whoami"];
  let score=0;

  for(const t of tests){
    const r=await fetchSafe(base+t);
    if(!r){add(`${t} blocked`);continue;}
    const txt=await r.text();
    if(/uid=|root:/i.test(txt)){add(`${t} EXEC STRING [HIGH]`);score+=3;}
    else if(/error|warning/i.test(txt)){add(`${t} ERROR LEAK [MEDIUM]`);score+=2;}
    else add(`${t} no indication`);
  }

  add("\nResult");
  add(score>=5?"LIKELY RCE":"No strong indication");
}

/* ========= BRUTE LAB ========= */
let uWL=[],pWL=[];
userWL.onchange=e=>{const r=new FileReader();r.onload=()=>uWL=r.result.split(/\r?\n/);r.readAsText(e.target.files[0]);};
passWL.onchange=e=>{const r=new FileReader();r.onload=()=>pWL=r.result.split(/\r?\n/);r.readAsText(e.target.files[0]);};

function runBrute(){
  const url=loginUrl.value||"/wp-login.php";
  const users=singleUser.value?[singleUser.value]:uWL;
  const pass=singlePass.value?[singlePass.value]:pWL;

  let log=`Brute Force LAB Simulation
--------------------------
Login URL : ${url}
Users     : ${users.length}
Passwords : ${pass.length}

Sample Attempts
---------------\n`;

  users.slice(0,1).forEach(u=>{
    pass.slice(0,3).forEach(p=>{
      log+=`POST ${url} | ${u} : ${p}\n`;
    });
  });

  log+="\nSAFE MODE – no request sent";
  out(log);
}
</script>
</body>
</html>
