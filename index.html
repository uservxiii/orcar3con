<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WebScan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:monospace;background:#0b1220;color:#e9efff}
.container{padding:20px;max-width:1100px;margin:auto}
input,button{padding:10px;font-family:monospace}
button{cursor:pointer}
pre{background:#050814;padding:16px;border-radius:8px;white-space:pre-wrap}
h1{margin-top:0}
</style>
</head>
<body>
<div class="container">
<h1>ORCA WebScan</h1>

<input id="target" placeholder="https://target.tld" style="width:70%">
<button onclick="scan()">SCAN</button>

<pre id="out">Idle.</pre>
</div>

<script>
const out = document.getElementById("out");
const log = [];
const add = t => log.push(t);
const render = () => out.textContent = log.join("\n");
const clear = () => log.length = 0;

async function proxy(url){
  const r = await fetch("proxy.php?u="+encodeURIComponent(url));
  if(!r.ok) return null;
  return r;
}

async function scan(){
  clear();
  const base = document.getElementById("target").value.replace(/\/$/,"");
  if(!base) return;

  add("Scanning target");
  add("===============");
  add(base+"\n");
  render();

  const res = await proxy(base);
  if(!res){ add("Target unreachable"); return render(); }

  const html = await res.text();
  const server = res.headers.get("server") || "hidden";

  add("Server / CDN");
  add("------------");
  add(server+"\n");

  /* CMS DETECTION */
  let cms="Unknown";
  if(/wp-content|wp-includes|wordpress/i.test(html)) cms="WordPress";
  else if(/Joomla!|com_content/i.test(html)) cms="Joomla";
  else if(/Drupal.settings|drupal/i.test(html)) cms="Drupal";
  else cms="Static / Other";

  add("CMS");
  add("---");
  add(cms+"\n");

  if(cms==="WordPress"){
    await wpUsers(base);
    await wpPlugins(html);
  } else {
    add("WP Modules Skipped (CMS not WordPress)");
  }

  add("\nScan completed.");
  render();
}

/* ================= WP USERS ================= */
async function wpUsers(base){
  add("User Enumeration");
  add("-----------------");

  const r = await proxy(base+"/wp-json/wp/v2/users");
  if(!r || r.status!==200){
    add("No users discovered\n");
    return;
  }

  try{
    const j = await r.json();
    if(!j.length){ add("No users discovered\n"); return; }
    j.forEach(u=>add("User: "+u.slug));
    add("");
  }catch{
    add("No users discovered\n");
  }
}

/* ================= PLUGIN FINGERPRINT ================= */
async function wpPlugins(html){
  add("Plugin Fingerprint");
  add("------------------");

  const plugins = {
    "revslider": /revslider/i,
    "wp-file-manager": /wp-file-manager/i,
    "elementor": /elementor/i
  };

  let found=false;

  for(const p in plugins){
    if(plugins[p].test(html)){
      found=true;
      add("Plugin : "+p);
      await mapCVE(p);
      add("");
    }
  }

  if(!found) add("No plugin fingerprint detected\n");
}

/* ================= CVE MAP ================= */
async function mapCVE(plugin){
  const r = await fetch("cve-map.json");
  const db = await r.json();
  if(!db[plugin]){
    add("CVE    : none mapped");
    return;
  }
  db[plugin].forEach(c=>{
    add("CVE    : "+c.id);
    add(" ↳ "+c.desc);
  });
}
</script>
</body>
</html>
