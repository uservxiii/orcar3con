<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORCA WebScan (Stable)</title>
<style>
  :root{
    --navy:#0b1d3a;
    --white:#fff;
    --gray:#f4f6fb;
    --border:#e0e6f2;
    --ok:#0a6;
    --warn:#a80;
    --err:#a00;
    --shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  [data-theme="dark"]{
    --navy:#e9efff;
    --white:#0b1220;
    --gray:#0a1020;
    --border:#1b2436;
    --shadow: 0 10px 26px rgba(0,0,0,0.4);
  }
  body{
    margin:0;
    font-family:system-ui;
    background: linear-gradient(180deg, #f7f9ff 0%, #f4f6fb 100%);
  }
  [data-theme="dark"] body{
    background: linear-gradient(180deg, #0a0f1f 0%, #0a1020 100%);
  }
  .app{
    display:flex;
    height:100vh;
    overflow:hidden;
  }
  .sidebar{
    width:280px;
    background:var(--white);
    border-right:1px solid var(--border);
    box-shadow: var(--shadow);
    padding:20px;
    box-sizing:border-box;
  }
  [data-theme="dark"] .sidebar{
    background:#0f172a;
    border-color:#1b2436;
  }
  .sidebar h1{
    font-size:20px;
    margin:0 0 10px 0;
    color:var(--navy);
  }
  .sidebar .small{
    font-size:13px;
    color:#666;
    margin:0 0 14px 0;
  }
  .sidebar button{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--navy);
    color:#fff;
    cursor:pointer;
    margin-bottom:10px;
  }
  .sidebar button:hover{ transform:translateY(-1px); }
  .sidebar button:active{ transform:translateY(0); }
  .sidebar .btn-secondary{
    background:#fff;
    color:var(--navy);
  }
  .sidebar .btn-secondary:hover{
    background:#f4f6fb;
  }
  .main{
    flex:1;
    overflow:auto;
    padding:20px;
    box-sizing:border-box;
  }
  .tabs{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .tab{
    padding:10px 14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--white);
    cursor:pointer;
  }
  .tab.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
  }
  [data-theme="dark"] .tab{
    background:#0f172a;
  }
  .card{
    background:var(--white);
    border-radius:18px;
    padding:20px;
    border:1px solid var(--border);
    box-shadow: var(--shadow);
  }
  [data-theme="dark"] .card{
    background:#0f172a;
    border-color:#1b2436;
  }
  input,button,textarea,select{
    padding:12px;
    font-size:16px;
    border-radius:12px;
    border:1px solid var(--border);
    width:100%;
    box-sizing:border-box;
    background:var(--white);
    color:var(--navy);
  }
  [data-theme="dark"] input,[data-theme="dark"] textarea,[data-theme="dark"] select{
    background:#121a2c;
    color:#e9efff;
  }
  .row{
    display:flex;
    gap:12px;
    align-items:center;
  }
  .row > *{ flex:1; }
  .badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:8px;
    font-size:12px;
    margin-left:6px;
  }
  .ok{ background:#d4f8e8; color:var(--ok); }
  .warn{ background:#fff4cc; color:var(--warn); }
  .err{ background:#ffd6d6; color:var(--err); }
  pre{
    background:#f7f9ff;
    padding:15px;
    border-radius:12px;
    overflow:auto;
    white-space:pre-wrap;
    color:var(--navy);
  }
  [data-theme="dark"] pre{
    background:#0f172a;
    color:#e9efff;
  }
  .progress{
    height:10px;
    background:#e9edf7;
    border-radius:8px;
    overflow:hidden;
    margin:10px 0 14px 0;
  }
  .progress > div{
    height:100%;
    width:0;
    background:var(--navy);
    transition: width .2s ease;
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h1>ORCA WebScan</h1>
    <p class="small">⚠️ Only scan targets you own or have permission to test.</p>
    <button id="btnScan">Start Scan</button>
    <button id="btnExport" class="btn-secondary">Export Report</button>
    <button id="btnHistory" class="btn-secondary">Show History</button>
    <button id="btnTheme" class="btn-secondary">Toggle Theme</button>
    <hr>
    <div class="small">Target:</div>
    <input id="target" placeholder="example.com" />
    <div class="progress"><div id="bar"></div></div>
    <div class="small">Status:</div>
    <pre id="status">Idle</pre>
  </div>

  <div class="main">
    <div class="tabs">
      <div class="tab active" data-tab="scan">Scan</div>
      <div class="tab" data-tab="lab">Lab</div>
      <div class="tab" data-tab="history">History</div>
    </div>

    <div id="tab-scan" class="card tab-content">
      <h2>Scan</h2>
      <div class="row">
        <input id="scanTarget" placeholder="domain.com" />
        <button id="scanBtn">Scan</button>
      </div>
      <div id="scanOut" style="margin-top:12px;">
        <pre>No scan yet.</pre>
      </div>
    </div>

    <div id="tab-lab" class="card tab-content" style="display:none;">
      <h2>Lab</h2>
      <div class="row">
        <input id="labEndpoint" placeholder="/path?param=" />
        <select id="labMethod">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
        </select>
      </div>
      <div style="margin-top:12px;">
        <textarea id="labPayload" rows="4" placeholder="payload"></textarea>
      </div>
      <div class="row" style="margin-top:12px;">
        <button id="labRun">Run</button>
        <button id="labValidate">Validate</button>
      </div>
      <div id="labOut" style="margin-top:12px;">
        <pre>No lab test yet.</pre>
      </div>
    </div>

    <div id="tab-history" class="card tab-content" style="display:none;">
      <h2>History</h2>
      <div id="historyOut">
        <pre>No history yet.</pre>
      </div>
    </div>
  </div>
</div>

<script>
const PROXY = "https://r.jina.ai/http://";
const ports = [80, 443, 8080, 8443];

let lastReport = null;

// helpers
function clean(d){ return d.trim().replace(/^https?:\/\//,'').replace(/\/+$/,''); }
function setProgress(p){ document.getElementById("bar").style.width = p + "%"; }
function setStatus(txt){ document.getElementById("status").textContent = txt; }
function badge(txt,cls){ return `<span class="badge ${cls}">${txt}</span>`; }
function section(title, html){ return `<h3>${title}</h3>${html}`; }
async function timeoutFetch(url, ms=8000){
  const c = new AbortController();
  setTimeout(()=>c.abort(), ms);
  return fetch(url, {signal:c.signal});
}
function saveHistory(report){
  const h = JSON.parse(localStorage.getItem("orca_history")||"[]");
  h.unshift({time:new Date().toISOString(), report});
  localStorage.setItem("orca_history", JSON.stringify(h.slice(0, 20)));
  renderHistory();
}
function renderHistory(){
  const h = JSON.parse(localStorage.getItem("orca_history")||"[]");
  const out = document.getElementById("historyOut");
  if(!h.length){
    out.innerHTML = "<pre>No history yet.</pre>";
    return;
  }
  out.innerHTML = "<pre>" + h.map(x=>`${x.time}\n${JSON.stringify(x.report, null, 2)}`).join("\n\n") + "</pre>";
}
function exportReport(){
  if(!lastReport){ alert("No report to export yet."); return; }
  const blob = new Blob([JSON.stringify(lastReport, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "orca_report.json";
  a.click();
  URL.revokeObjectURL(url);
}

// scan
async function scanHTTP(domain){
  const r = await timeoutFetch(PROXY + "http://" + domain);
  const text = await r.text();
  let headersObj = {};
  r.headers.forEach((v,k)=> headersObj[k]=v);
  return {status:r.status, url:r.url, headers:headersObj, body:text, https:r.url.startsWith("https")};
}
function scanHeaders(h){
  const headersCheck=[
    "content-security-policy",
    "strict-transport-security",
    "x-frame-options",
    "x-content-type-options",
    "referrer-policy",
    "permissions-policy"
  ];
  return headersCheck.map(x=>({name:x,ok:!!h[x]}));
}
async function scanDNS(domain){
  const types=["A","AAAA","MX","NS","TXT"];
  let out={};
  for(const t of types){
    try{
      const r=await fetch(`https://dns.google/resolve?name=${domain}&type=${t}`);
      const j=await r.json();
      out[t]=j.Answer?.map(x=>x.data)||[];
    }catch{ out[t]=[]; }
  }
  return out;
}
async function scanPorts(domain){
  let res={};
  for(const p of ports){
    try{
      await timeoutFetch(`http://${domain}:${p}`,3000);
      res[p]=true;
    }catch{res[p]=false;}
  }
  return res;
}
function detectWAF(headers, body){
  const waf=[];
  const h=k=> (headers[k]||"").toLowerCase();
  const b=(body||"").toLowerCase();
  if(h("server").includes("cloudflare")||h("cf-ray")) waf.push("Cloudflare");
  if(h("x-sucuri-id")||b.includes("sucuri firewall")) waf.push("Sucuri");
  if(h("x-akamai-transformed")||h("akamai-ghost")) waf.push("Akamai");
  if(h("x-incapsula")||b.includes("incapsula")) waf.push("Imperva");
  if(h("x-waf")||h("x-firewall")) waf.push("Generic WAF");
  let level="None";
  if(waf.length){
    level = waf.some(x=>["Cloudflare","Akamai","Imperva"].includes(x)) ? "High" : "Medium";
  }
  return {vendors:[...new Set(waf)], level};
}
function risk(r){
  let s=0;
  if(!r.http.https) s+=20;
  if(!r.headers.find(x=>x.name==="content-security-policy"&&x.ok)) s+=10;
  if(r.waf.level==="High") s+=10;
  return {score:s,level:s<20?"Low":s<40?"Medium":"High"};
}

// run
async function runScan(domain){
  setStatus("Scanning...");
  setProgress(5);
  try{
    const r = {};
    r.http = await scanHTTP(domain);
    setProgress(30);
    r.headers = scanHeaders(r.http.headers);
    setProgress(45);
    r.dns = await scanDNS(domain);
    setProgress(60);
    r.ports = await scanPorts(domain);
    setProgress(80);
    r.waf = detectWAF(r.http.headers, r.http.body);
    r.risk = risk(r);
    setProgress(100);

    lastReport = r;
    saveHistory(r);

    const out = `
${section("HTTP", `
Status: ${r.http.status} ${r.http.status===200?badge("OK","ok"):badge("BAD","err")}
HTTPS: ${r.http.https?badge("YES","ok"):badge("NO","warn")}
`)}
${section("Security Headers", r.headers.map(h=>`${h.name}: ${h.ok?badge("OK","ok"):badge("MISSING","warn")}`).join("<br>"))}
${section("WAF", `Detected: ${r.waf.vendors.join(", ")||"None"}<br>Protection: ${r.waf.level}`)}
${section("DNS", Object.entries(r.dns).map(([k,v])=>`${k}: ${v.join(", ")||"None"}`).join("<br>"))}
${section("Ports", Object.entries(r.ports).map(([p,o])=>`${p}: ${o?"Open":"Closed"}`).join("<br>"))}
${section("Risk", `Level: ${r.risk.level}<br>Score: ${r.risk.score}`)}
`;
    document.getElementById("scanOut").innerHTML = `<pre>${out}</pre>`;
    setStatus("Scan completed.");
  }catch(e){
    setStatus("Scan failed (CORS/proxy/timeout).");
    setProgress(0);
    document.getElementById("scanOut").innerHTML = "<pre>Scan failed. Try another target.</pre>";
  }
}

// lab
function buildUrl(domain, ep, payload, method){
  const base = PROXY + "http://" + domain;
  if(method==="GET"){
    const sep = ep.includes("?") ? "&" : "?";
    return base + ep + sep + encodeURIComponent(payload);
  }
  return base + ep;
}
async function labRun(){
  const domain = clean(document.getElementById("scanTarget").value);
  const ep = document.getElementById("labEndpoint").value.trim();
  const method = document.getElementById("labMethod").value;
  const payload = document.getElementById("labPayload").value.trim();
  if(!domain || !ep || !payload){
    document.getElementById("labOut").innerHTML = "<pre>Target, endpoint & payload required.</pre>";
    return;
  }
  const url = buildUrl(domain, ep, payload, method);
  try{
    const res = await timeoutFetch(url, 8000);
    const text = await res.text();
    document.getElementById("labOut").innerHTML = `<pre>Status: ${res.status}\nURL: ${res.url}\n\n${text.slice(0,500)}</pre>`;
  }catch{
    document.getElementById("labOut").innerHTML = "<pre>Lab request failed (CORS/proxy/timeout).</pre>";
  }
}
async function labValidate(){
  const domain = clean(document.getElementById("scanTarget").value);
  const ep = document.getElementById("labEndpoint").value.trim();
  const method = document.getElementById("labMethod").value;
  if(!domain || !ep){
    document.getElementById("labOut").innerHTML = "<pre>Target + endpoint required.</pre>";
    return;
  }
  const token = "ORCA_" + Math.random().toString(36).substring(2, 10).toUpperCase();
  const payload = `echo ${token}`;
  const url = buildUrl(domain, ep, payload, method);
  try{
    const res = await timeoutFetch(url, 8000);
    const text = await res.text();
    const ok = text.includes(token);
    document.getElementById("labOut").innerHTML = `<pre>VALIDATION RESULT: ${ok ? "VALID" : "NOT VALID"}\nToken: ${token}\n\n${text.slice(0,500)}</pre>`;
  }catch{
    document.getElementById("labOut").innerHTML = "<pre>Validation failed (CORS/proxy/timeout).</pre>";
  }
}

// tabs
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.querySelectorAll(".tab-content").forEach(c=>c.style.display="none");
    document.getElementById("tab-"+t.dataset.tab).style.display="block";
  });
});

// buttons
document.getElementById("btnTheme").addEventListener("click", ()=>{
  const root = document.documentElement;
  const t = root.getAttribute("data-theme");
  root.setAttribute("data-theme", t==="dark" ? "light" : "dark");
});
document.getElementById("btnExport").addEventListener("click", exportReport);
document.getElementById("btnHistory").addEventListener("click", ()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelector('.tab[data-tab="history"]').classList.add("active");
  document.querySelectorAll(".tab-content").forEach(c=>c.style.display="none");
  document.getElementById("tab-history").style.display="block";
  renderHistory();
});
document.getElementById("btnScan").addEventListener("click", ()=>{
  const domain = clean(document.getElementById("target").value);
  if(!domain){ setStatus("Target required."); return; }
  document.getElementById("scanTarget").value = domain;
  runScan(domain);
});
document.getElementById("scanBtn").addEventListener("click", ()=>{
  const domain = clean(document.getElementById("scanTarget").value);
  if(!domain){ setStatus("Target required."); return; }
  runScan(domain);
});
document.getElementById("labRun").addEventListener("click", labRun);
document.getElementById("labValidate").addEventListener("click", labValidate);

// initial
setProgress(0);
setStatus("Idle");
renderHistory();
</script>
</body>
</html>
