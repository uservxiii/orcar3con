<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WebScan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#0b0f1a;
  color:#e6e6eb;
  font-family: monospace;
  margin:0;
}
header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid #1e2538;
}
header h1{
  margin:0;
  letter-spacing:3px;
}
header span{
  color:#4cc9f0;
}
main{
  padding:20px;
}
input,button{
  background:#12182b;
  border:1px solid #2a345a;
  color:#e6e6eb;
  padding:10px;
  font-family: monospace;
}
input{
  width:70%;
}
button{
  cursor:pointer;
}
button:hover{
  background:#1b2342;
}
pre{
  background:#060914;
  padding:15px;
  border:1px solid #1e2538;
  overflow:auto;
}
.alert{
  color:#ff5555;
}
.ok{
  color:#55ff99;
}
.warn{
  color:#ffd166;
}
</style>
</head>

<body>

<header>
  <h1><span>ORCA</span> WebScan</h1>
</header>

<main>
  <input id="target" placeholder="http://localhost/wordpress">
  <button onclick="scan()">SCAN</button>

  <pre id="out"></pre>
</main>

<script>
const out = document.getElementById("out");
function add(t,c=""){
  out.innerHTML += c ? `<span class="${c}">${t}</span>\n` : t+"\n";
}
function clearOut(){ out.innerHTML=""; }

async function fetchSafe(u,opt={}){
  try{ return await fetch(u,opt); }
  catch{ return null; }
}

/* ================= CORE SCAN ================= */

async function scan(){
  clearOut();
  const base=document.getElementById("target").value.replace(/\/$/,"");
  if(!base) return;

  add("[*] Target: "+base+"\n");

  await wpDetect(base);
  await enumUsers(base);
  await adminLoginFingerprint(base);
  await rceDetect(base);

  add("\n[✓] Scan Finished","ok");
}

/* ================= WORDPRESS ================= */

async function wpDetect(base){
  add("[+] WordPress Detection");
  const r=await fetchSafe(base);
  if(!r){ add("Connection failed","alert"); return; }
  const t=await r.text();
  if(/wp-content|wp-includes/i.test(t)){
    add("WordPress detected","ok");
  }else{
    add("WordPress not detected","warn");
  }
  add("");
}

/* ================= USER ENUM ================= */

async function enumUsers(base){
  add("[+] User Enumeration");
  let users=new Set();
  let admin=false;

  // REST API
  const api=await fetchSafe(base+"/wp-json/wp/v2/users?per_page=100");
  if(api && api.status===200){
    try{
      (await api.json()).forEach(u=>{
        users.add(u.slug);
        if(u.slug==="admin") admin=true;
      });
    }catch{}
  }

  // Author enum
  for(let i=1;i<=10;i++){
    const r=await fetchSafe(base+"/?author="+i);
    if(r && r.url){
      const m=r.url.match(/\/author\/([^\/]+)/);
      if(m){
        users.add(m[1]);
        if(m[1]==="admin") admin=true;
      }
    }
  }

  if(admin){
    add("ADMIN USER FOUND: admin","alert");
  }

  users.forEach(u=>add("User: "+u));
  if(!users.size) add("No users exposed","warn");
  add("");
}

/* ================= ADMIN LOGIN FINGERPRINT ================= */

async function adminLoginFingerprint(base){
  add("[+] Admin Login Fingerprint");

  const r=await fetchSafe(base+"/wp-login.php",{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"log=admin&pwd=wrongpassword"
  });

  if(!r){ add("Login endpoint unreachable","warn"); return; }
  const t=await r.text();

  if(/incorrect password/i.test(t)){
    add("admin username VALID","alert");
  }else if(/invalid username/i.test(t)){
    add("admin username NOT FOUND","warn");
  }else{
    add("admin status UNKNOWN","warn");
  }
  add("");
}

/* ================= RCE DETECTION (VALID) ================= */

async function rceDetect(base){
  add("[+] RCE Detection");

  const checks=[
    {
      name:"WP File Manager ≤ 6.9",
      path:"/wp-content/plugins/wp-file-manager/readme.txt",
      sig:/6\.[0-9]/
    },
    {
      name:"Elementor <= 3.6",
      path:"/wp-content/plugins/elementor/readme.txt",
      sig:/<=\s*3\.6/
    }
  ];

  let found=false;

  for(const c of checks){
    const r=await fetchSafe(base+c.path);
    if(r && r.status===200){
      const t=await r.text();
      if(c.sig.test(t)){
        add("RCE POSSIBLE: "+c.name,"alert");
        found=true;
      }
    }
  }

  if(!found) add("No known RCE vectors exposed","ok");
  add("");
}
</script>

</body>
</html>
