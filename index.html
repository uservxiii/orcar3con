<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WebScan – WordPress LAB</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0b1220;
  --panel:#121a2c;
  --text:#e9efff;
  --accent:#4f7cff;
}
.light{
  --bg:#f4f6fb;
  --panel:#ffffff;
  --text:#0b1220;
  --accent:#3b6cff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}
.sidebar{
  width:230px;
  background:var(--panel);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.sidebar h2{margin:0}
.sidebar button{
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}
.sidebar .ghost{
  background:transparent;
  color:var(--text);
  border:1px solid var(--accent);
}
.main{
  flex:1;
  padding:24px;
  overflow:auto;
}
.card{
  background:var(--panel);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
}
input{
  width:100%;
  padding:14px;
  margin-top:8px;
  border-radius:12px;
  border:none;
  font-size:15px;
}
pre{
  background:#0a1020;
  color:#cde;
  padding:16px;
  border-radius:14px;
  white-space:pre-wrap;
  height:320px;
  overflow:auto;
}
.light pre{background:#eef2ff;color:#111}
small{opacity:.7}
</style>
</head>

<body>

<div class="sidebar">
  <h2>🛡️ ORCA</h2>
  <button onclick="scan()">Scan Target</button>
  <button class="ghost" onclick="bruteForce()">Brute Force (LAB)</button>
  <button class="ghost" onclick="toggleTheme()">🌗 Light / Dark</button>
</div>

<div class="main">
  <h1>ORCA WebScan – WordPress LAB</h1>

  <div class="card">
    <input id="target" placeholder="example.com (press ENTER)" />
  </div>

  <!-- BRUTE FORCE PANEL -->
  <div class="card" id="bruteCard" style="display:none">
    <h3>Brute Force LAB (Timed Simulation)</h3>

    <input id="loginUrl" placeholder="Login URL (https://target/wp-login.php)" />

    <small>Username</small>
    <input id="singleUser" placeholder="Single username (optional)" />
    <input type="file" id="userWL" accept=".txt" />

    <small>Password</small>
    <input id="singlePass" placeholder="Single password (optional)" />
    <input type="file" id="passWL" accept=".txt" />

    <button style="margin-top:12px" onclick="runBruteLab()">Start LAB</button>
  </div>

  <div class="card">
    <pre id="out">Idle.</pre>
  </div>
</div>

<script>
/* ================= CORE ================= */
const outEl=document.getElementById("out");
const out=t=>outEl.textContent=t;
const append=t=>{
  outEl.textContent+=t;
  outEl.scrollTop=outEl.scrollHeight;
};

/* ================= SCAN (PASSIVE) ================= */
function scan(){
  out(`Passive Scan
------------
This build focuses on
Brute Force LAB timing demo

Status: OK
`);
}

/* ================= BRUTE FORCE LAB ================= */
let userList=[], passList=[];
let running=false;

function bruteForce(){
  document.getElementById("bruteCard").style.display="block";
  out("Brute Force LAB ready.\nWaiting for input...");
}

/* load username wordlist */
userWL.addEventListener("change",e=>{
  const r=new FileReader();
  r.onload=()=>userList=r.result.split(/\r?\n/).filter(x=>x);
  r.readAsText(e.target.files[0]);
});

/* load password wordlist */
passWL.addEventListener("change",e=>{
  const r=new FileReader();
  r.onload=()=>passList=r.result.split(/\r?\n/).filter(x=>x);
  r.readAsText(e.target.files[0]);
});

async function runBruteLab(){
  if(running) return;
  running=true;

  const url=loginUrl.value.trim();
  if(!url){ out("Login URL required"); running=false; return; }

  const users = singleUser.value ? [singleUser.value] : userList.length ? userList : ["admin"];
  const passes = singlePass.value ? [singlePass.value] : passList;

  if(!passes.length){
    out("Password list empty!");
    running=false;
    return;
  }

  const ratePerMin=5;                 // simulated rate
  const delay=60000/ratePerMin;       // ms per attempt
  const total=users.length*passes.length;
  let count=0;
  const start=Date.now();

  out(
`Brute Force LAB Simulation
--------------------------
Login URL : ${url}
Users     : ${users.length}
Passwords : ${passes.length}
Total     : ${total}
Rate      : ${ratePerMin}/min

Starting...
`);

  for(const u of users){
    for(const p of passes){
      if(!running) break;

      count++;
      const elapsed=(Date.now()-start)/1000;
      const eta=Math.round((total-count)*(elapsed/count));

      append(
`[${count}/${total}] ${u}:${p}
ETA ~ ${Math.floor(eta/60)}m ${eta%60}s

`);

      await new Promise(r=>setTimeout(r,delay));
    }
  }

  append(`
Status
------
SAFE LAB MODE
No HTTP request sent
Simulation finished
`);
  running=false;
}

/* ================= THEME ================= */
function toggleTheme(){
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
