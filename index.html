<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WebScan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0b1220;
  --panel:#121a2c;
  --text:#e9efff;
  --accent:#4f7cff
}
.light{
  --bg:#f4f6fb;
  --panel:#ffffff;
  --text:#0b1220;
  --accent:#3b6cff
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh
}
.sidebar{
  width:260px;
  background:var(--panel);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:10px
}
.sidebar h2{margin:0}
.sidebar button{
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--accent);
  color:#fff;
  cursor:pointer
}
.sidebar .ghost{
  background:transparent;
  color:var(--text);
  border:1px solid var(--accent)
}
.main{
  flex:1;
  padding:24px;
  overflow:auto
}
.card{
  background:var(--panel);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px
}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-bottom:8px
}
pre{
  background:#0a1020;
  color:#cde;
  padding:16px;
  border-radius:14px;
  white-space:pre-wrap
}
.light pre{background:#eef2ff;color:#111}
small{opacity:.7}
</style>
</head>

<body>

<div class="sidebar">
  <h2>🛡️ ORCA</h2>
  <button onclick="scan()">Scan Target</button>
  <button class="ghost" onclick="rceValidate()">RCE Validation</button>
  <button class="ghost" onclick="toggleTheme()">🌗 Theme</button>
</div>

<div class="main">
  <h1>ORCA WebScan</h1>

  <div class="card">
    <input id="target" placeholder="https://example.com">
    <small>Passive scanning · Safe request only</small>
  </div>

  <div class="card">
    <pre id="out">Idle.</pre>
  </div>
</div>

<script>
/* ================= LOG ================= */
const log=[];
const add=t=>log.push(t);
const render=()=>out.textContent=log.join("\n");
const clearLog=()=>log.length=0;

/* ================= UI ================= */
target.addEventListener("keydown",e=>{
  if(e.key==="Enter") scan();
});
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* ================= SAFE FETCH ================= */
async function fetchSafe(u){
  try{
    return await fetch(u,{redirect:"manual"});
  }catch{
    return null;
  }
}

/* ================= MAIN SCAN ================= */
async function scan(){
  clearLog();
  const base=target.value.replace(/\/$/,"");
  if(!base) return;

  add("Scanning target");
  add("===============");
  add(base+"\n");
  render();

  const home=await fetchSafe(base);
  if(!home){
    add("Target unreachable");
    render();
    return;
  }

  const html=await home.text();

  add("Server / CDN");
  add("------------");
  add(home.headers.get("server") || "hidden");
  if(home.headers.get("cf-ray")) add("Cloudflare detected");
  add("");

  add("WordPress");
  add("----------");
  const isWP=/wp-content|wp-includes/i.test(html);
  add(isWP ? "YES" : "NO");
  add("");

  if(isWP){
    await enumUsers(base);
    await pluginScan(base);
  }

  add("\nScan completed.");
  render();
}

/* ================= USER ENUM ================= */
async function enumUsers(base){
  add("User Enumeration");
  add("-----------------");

  let users=new Set();

  const api=await fetchSafe(base+"/wp-json/wp/v2/users");
  if(api){
    if(api.status===200){
      add("REST API : EXPOSED (CORS may block browser access)");
    }else if(api.status===401 || api.status===403){
      add("REST API : PROTECTED");
    }else{
      add("REST API : UNKNOWN ("+api.status+")");
    }
  }else{
    add("REST API : BLOCKED");
  }

  for(let i=1;i<=10;i++){
    const r=await fetchSafe(base+"/?author="+i);
    if(r && r.url){
      const m=r.url.match(/\/author\/([^\/]+)/);
      if(m) users.add(m[1]);
    }
  }

  if(users.size){
    users.forEach(u=>add("User: "+u));
  }else{
    add("No users discovered via author enumeration");
  }

  add("");
}

/* ================= PLUGIN SCAN ================= */
async function pluginScan(base){
  add("Plugin Detection");
  add("----------------");

  const plugins=[
    {n:"revslider",p:"/wp-content/plugins/revslider/",c:"CVE-2014-9734",r:"HIGH"},
    {n:"wp-file-manager",p:"/wp-content/plugins/wp-file-manager/",c:"CVE-2020-25213",r:"HIGH"},
    {n:"elementor",p:"/wp-content/plugins/elementor/",c:"CVE-2023-48777",r:"MEDIUM"}
  ];

  let found=false;

  for(const x of plugins){
    const r=await fetchSafe(base+x.p);
    if(!r) continue;

    found=true;
    add("Plugin : "+x.n);
    add("Path   : "+x.p);
    add("Risk   : "+x.r);
    add("CVE    : "+x.c);
    add("");
  }

  if(!found) add("No known vulnerable plugin detected\n");
}

/* ================= RCE VALIDATION ================= */
async function rceValidate(){
  const base=target.value.replace(/\/$/,"");
  if(!base) return;

  add("\nRCE Validation");
  add("--------------");

  const tests=[
    "/?cmd=id",
    "/?exec=whoami",
    "/wp-admin/admin-ajax.php?action=test"
  ];

  let score=0;

  for(const t of tests){
    const r=await fetchSafe(base+t);
    if(!r){
      add(t+" → blocked");
      continue;
    }

    const txt=await r.text();
    if(/uid=|gid=|root:/i.test(txt)){
      add(t+" → EXEC STRING DETECTED");
      score+=3;
    }else if(/warning|fatal error/i.test(txt)){
      add(t+" → ERROR LEAK");
      score+=2;
    }else{
      add(t+" → OK");
    }
  }

  add("\nResult");
  add("------");
  add(
    score>=5 ? "LIKELY VULNERABLE (HIGH)" :
    score>=2 ? "POTENTIAL (MEDIUM)" :
    "No RCE indication (LOW)"
  );
  add("Safe validation – no payload executed");
  render();
}
</script>

</body>
</html>
