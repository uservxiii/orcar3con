<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WPScan – Web Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html,body{
  margin:0;
  height:100%;
  background:#1e1e1e;
  color:#d4d4d4;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
#wrap{
  display:flex;
  flex-direction:column;
  height:100%;
}
#header{
  padding:10px 14px;
  background:#252526;
  border-bottom:1px solid #333;
}
#header span{color:#9cdcfe}
#input{
  padding:10px;
  background:#1e1e1e;
  border-bottom:1px solid #333;
}
#input input{
  width:100%;
  background:#000;
  color:#d4d4d4;
  border:1px solid #333;
  padding:8px;
  font-family:inherit;
}
#output{
  flex:1;
  padding:12px;
  overflow:auto;
  white-space:pre-wrap;
}
.green{color:#6a9955}
.red{color:#f44747}
.yellow{color:#dcdcaa}
.blue{color:#9cdcfe}
.gray{color:#808080}
</style>
</head>

<body>
<div id="wrap">

<div id="header">
  <span>ORCA WPScan</span> — Web Edition (read-only)
</div>

<div id="input">
  <input id="target" placeholder="https://target.com  (press Enter)">
</div>

<div id="output" id="out"></div>

</div>

<script>
/* ================= CORE ================= */
const out = document.getElementById("output");
const input = document.getElementById("target");

function log(txt, cls=""){
  const line=document.createElement("div");
  if(cls) line.className=cls;
  line.textContent=txt;
  out.appendChild(line);
  out.scrollTop=out.scrollHeight;
}
function clear(){ out.innerHTML=""; }

async function fetchSafe(url){
  try{ return await fetch(url,{redirect:"manual"}); }
  catch{ return null; }
}

/* ================= UTIL ================= */
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function parseVersion(v){
  return v.split(".").map(x=>parseInt(x)||0);
}
function cmp(a,b){
  for(let i=0;i<3;i++){
    if(a[i]>b[i]) return 1;
    if(a[i]<b[i]) return -1;
  }
  return 0;
}
function inRange(v,min,max){
  const pv=parseVersion(v);
  if(min && cmp(pv,parseVersion(min))<0) return false;
  if(max && cmp(pv,parseVersion(max))>0) return false;
  return true;
}

/* ================= CVE DB (CORE ONLY) ================= */
const WP_CVES=[
  {cve:"CVE-2022-21661",min:"5.8",max:"5.8.2",sev:"HIGH",desc:"WP_Query object injection"},
  {cve:"CVE-2023-2745",min:"6.1",max:"6.2.1",sev:"MED",desc:"Stored XSS via CSRF"},
  {cve:"CVE-2024-31210",min:"6.3",max:"6.4.3",sev:"HIGH",desc:"Password reset weakness"}
];

/* ================= SCAN ================= */
input.addEventListener("keydown",e=>{
  if(e.key==="Enter") scan();
});

async function scan(){
  clear();
  const base=input.value.replace(/\/$/,"");
  if(!base) return;

  log("[+] URL: "+base,"blue");
  log("[+] Starting ORCA WPScan...\n","gray");

  /* ---- CONNECTIVITY ---- */
  const home=await fetchSafe(base);
  if(!home){
    log("[-] Target unreachable","red");
    return;
  }

  log("[+] Target reachable","green");

  const html=await home.text();

  /* ---- WORDPRESS DETECT ---- */
  if(/wp-content|wp-includes/i.test(html)){
    log("[+] WordPress detected","green");
  }else{
    log("[-] WordPress not detected","red");
    return;
  }

  /* ---- VERSION DETECT ---- */
  let wpVersion=null;
  let m=html.match(/content="WordPress ([^"]+)"/i);
  if(!m){
    const rss=await fetchSafe(base+"/feed/");
    if(rss){
      const t=await rss.text();
      m=t.match(/wordpress.org\/\?v=([^<]+)/i);
    }
  }

  if(m){
    wpVersion=m[1];
    log("[+] WordPress version: "+wpVersion,"green");
  }else{
    log("[!] WordPress version: not detected","yellow");
  }

  await sleep(200);

  /* ---- USERS ENUM ---- */
  log("\n[+] Enumerating users ...","blue");
  let users=new Set();
  for(let i=1;i<=5;i++){
    const r=await fetchSafe(base+"/?author="+i);
    if(r && r.url){
      const u=r.url.match(/\/author\/([^\/]+)/);
      if(u) users.add(u[1]);
    }
  }
  if(users.size){
    users.forEach(u=>{
      log(" |__ "+u+(u==="admin"?"  <== CRITICAL":""));
    });
  }else{
    log(" |__ No users found","gray");
  }

  /* ---- XMLRPC ---- */
  log("\n[+] Checking XML-RPC ...","blue");
  const xr=await fetchSafe(base+"/xmlrpc.php");
  if(xr && xr.status===200){
    log(" |__ xmlrpc.php ENABLED","yellow");
  }else{
    log(" |__ xmlrpc.php disabled","green");
  }

  /* ---- SENSITIVE FILES ---- */
  log("\n[+] Checking sensitive files ...","blue");
  const files=["/readme.html","/.env","/wp-config.php~"];
  let hit=false;
  for(const f of files){
    const r=await fetchSafe(base+f);
    if(r && r.status===200){
      log(" |__ FOUND "+f,"red");
      hit=true;
    }
  }
  if(!hit) log(" |__ None found","green");

  /* ---- CVE MATCH ---- */
  log("\n[+] Enumerating known vulnerabilities ...","blue");
  if(wpVersion){
    let found=false;
    for(const c of WP_CVES){
      if(inRange(wpVersion,c.min,c.max)){
        found=true;
        log(
          ` |__ ${c.cve} (${c.sev}) - ${c.desc}`,
          c.sev==="HIGH"?"red":"yellow"
        );
      }
    }
    if(!found){
      log(" |__ No known core CVEs found","green");
    }
  }else{
    log(" |__ Version unknown, skipping CVE match","gray");
  }

  /* ---- DONE ---- */
  log("\n[+] Scan finished","green");
}
</script>

</body>
</html>
