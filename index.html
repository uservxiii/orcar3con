<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WebScan – WordPress LAB</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0b1220;
  --panel:#121a2c;
  --text:#e9efff;
  --accent:#4f7cff;
}
.light{
  --bg:#f4f6fb;
  --panel:#ffffff;
  --text:#0b1220;
  --accent:#3b6cff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}
.sidebar{
  width:230px;
  background:var(--panel);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.sidebar h2{margin:0}
.sidebar button{
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}
.sidebar .ghost{
  background:transparent;
  color:var(--text);
  border:1px solid var(--accent);
}
.main{
  flex:1;
  padding:24px;
  overflow:auto;
}
.card{
  background:var(--panel);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
}
input{
  width:100%;
  padding:14px;
  margin-top:8px;
  border-radius:12px;
  border:none;
  font-size:15px;
}
pre{
  background:#0a1020;
  color:#cde;
  padding:16px;
  border-radius:14px;
  white-space:pre-wrap;
}
.light pre{background:#eef2ff;color:#111}
small{opacity:.7}
</style>
</head>

<body>

<div class="sidebar">
  <h2>🛡️ ORCA</h2>
  <button onclick="scan()">Scan Target</button>
  <button class="ghost" onclick="bruteForce()">Brute Force (LAB)</button>
  <button class="ghost" onclick="toggleTheme()">🌗 Light / Dark</button>
</div>

<div class="main">
  <h1>ORCA WebScan – WordPress LAB</h1>

  <div class="card">
    <input id="target" placeholder="example.com (press ENTER)" />
  </div>

  <!-- BRUTE FORCE PANEL -->
  <div class="card" id="bruteCard" style="display:none">
    <h3>Brute Force LAB</h3>

    <input id="loginUrl" placeholder="Login URL (ex: https://target/wp-login.php)" />

    <small>Username</small>
    <input id="singleUser" placeholder="Single username (optional)" />
    <input type="file" id="userWL" accept=".txt" />

    <small>Password</small>
    <input id="singlePass" placeholder="Single password (optional)" />
    <input type="file" id="passWL" accept=".txt" />

    <button style="margin-top:12px" onclick="runBruteLab()">Run LAB Simulation</button>
  </div>

  <div class="card">
    <pre id="out">Idle.</pre>
  </div>
</div>

<script>
const out=t=>document.getElementById("out").textContent=t;
const clean=d=>d.replace(/^https?:\/\//,'').replace(/\/.*$/,'');

/* ================= ENTER SCAN ================= */
target.addEventListener("keydown",e=>{
  if(e.key==="Enter") scan();
});

/* ================= SCAN ================= */
async function scan(){
  const domain=clean(target.value.trim());
  if(!domain) return;
  out("Scanning target...");
  const base="https://"+domain;

  let log=
`Target
------
${domain}

WordPress Detection
------------------
SIMULATION MODE
`;

  log+=`
Admin Paths
-----------
/wp-login.php
/wp-admin/

XML-RPC
-------
xmlrpc.php

User Enumeration
----------------
REST API (wp-json)

Plugins
-------
Passive HTML parsing

Status
------
LAB SAFE MODE
`;
  out(log);
}

/* ================= BRUTE FORCE ================= */
let userList=[], passList=[];
let defaultWL=[
 "admin","password","admin123","wordpress",
 "123456","qwerty","qwerty123","welcome"
];

function bruteForce(){
  document.getElementById("bruteCard").style.display="block";
  out("Brute Force LAB ready.\nFill login URL & credentials.");
}

/* LOAD USER WORDLIST */
userWL.addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>userList=r.result.split(/\r?\n/).filter(x=>x);
  r.readAsText(f);
});

/* LOAD PASS WORDLIST */
passWL.addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>passList=r.result.split(/\r?\n/).filter(x=>x);
  r.readAsText(f);
});

/* RUN LAB */
function runBruteLab(){
  const url=loginUrl.value.trim();
  if(!url) return out("Login URL required!");

  const users = singleUser.value
    ? [singleUser.value]
    : userList.length ? userList : ["admin"];

  const passes = singlePass.value
    ? [singlePass.value]
    : passList.length ? passList : defaultWL;

  const rate=5;
  const tries=users.length*passes.length;
  const est=Math.ceil(tries/rate);

  let log=
`Brute Force LAB Simulation
--------------------------
Login URL : ${url}
Users     : ${users.length}
Passwords : ${passes.length}
Attempts  : ${tries}
Rate      : ${rate}/min
ETA       : ~${est} min

Sample Attempts
---------------
`;

  users.slice(0,3).forEach(u=>{
    passes.slice(0,3).forEach(p=>{
      log+=`POST ${url} | ${u}:${p}\n`;
    });
  });

  log+=`
Status
------
SAFE LAB MODE
No HTTP request sent
Simulation only
`;
  out(log);
}

/* ================= THEME ================= */
function toggleTheme(){
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
