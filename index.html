<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORCA WebScan</title>

<style>
:root{
  --navy:#0b1d3a;--white:#fff;--gray:#f4f6fb;--border:#e0e6f2;
}
body{margin:0;font-family:system-ui;background:var(--gray)}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;border-radius:14px;padding:20px;border:1px solid var(--border)}
h1{text-align:center;color:var(--navy)}
input,button{padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--border)}
button{background:var(--navy);color:#fff;cursor:pointer}
pre{background:#f7f9ff;padding:15px;border-radius:10px;overflow:auto}
.badge{display:inline-block;padding:4px 8px;border-radius:6px;font-size:12px}
.ok{background:#d4f8e8;color:#0a6}
.warn{background:#fff4cc;color:#a80}
.err{background:#ffd6d6;color:#a00}
</style>
</head>

<body>
<div class="container">
<h1>ORCA WebScan</h1>

<div class="card">
<input id="target" placeholder="domain.com">
<button onclick="run()">Scan</button>
<pre id="out"></pre>
</div>
</div>

<script>
const PROXY="https://r.jina.ai/http://";

function clean(d){
  return d.trim().replace(/^https?:\/\//,'').replace(/\/+$/,'');
}

async function timeoutFetch(url,ms=8000){
  const ctrl=new AbortController();
  setTimeout(()=>ctrl.abort(),ms);
  const r=await fetch(url,{signal:ctrl.signal});
  return r;
}

async function dns(domain){
  const r=await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
  return r.json();
}

function fingerprint(body){
  const map=[
    ["WordPress",/wp-content|wp-includes/i],
    ["Joomla",/Joomla!/i],
    ["Drupal",/drupal/i],
    ["Laravel",/laravel/i],
    ["Cloudflare",/cloudflare/i]
  ];
  return map.filter(x=>x[1].test(body)).map(x=>x[0]);
}

async function run(){
  const o=document.getElementById("out");
  o.textContent="Scanning...\n";
  const domain=clean(document.getElementById("target").value);
  if(!domain)return;

  let result={target:domain};

  try{
    const r=await timeoutFetch(PROXY+"http://"+domain);
    const text=await r.text();

    result.http={
      status:r.status,
      redirect:r.url,
      reachable:r.status<500
    };

    result.fingerprint=fingerprint(text);
  }catch(e){
    result.http={error:"Request blocked or timeout"};
  }

  try{
    const d=await dns(domain);
    result.dns=d.Answer?.map(x=>x.data)||[];
  }catch{
    result.dns="DNS lookup failed";
  }

  result.note=[
    "HTML-only scanner",
    "No exploitation",
    "Indicators only"
  ];

  o.textContent=JSON.stringify(result,null,2);
}
</script>
</body>
</html>
