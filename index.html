<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WebScan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0b1220;--panel:#121a2c;--text:#e9efff;--accent:#4f7cff}
*{box-sizing:border-box}
body{
  margin:0;font-family:monospace;
  background:var(--bg);color:var(--text);
  height:100vh;display:flex
}
.sidebar{
  width:250px;background:var(--panel);
  padding:18px;display:flex;flex-direction:column;gap:10px
}
button{
  padding:10px;border-radius:10px;border:none;
  background:var(--accent);color:#fff;cursor:pointer
}
.main{flex:1;padding:18px;overflow:auto}
.card{
  background:var(--panel);
  border-radius:14px;
  padding:14px;margin-bottom:14px
}
input{
  width:100%;padding:10px;border-radius:8px;
  border:none;margin-bottom:6px
}
pre{
  background:#060b18;
  padding:14px;border-radius:12px;
  white-space:pre-wrap
}
.ok{color:#7CFF7C}
.warn{color:#FFD27C}
.bad{color:#FF7C7C}
</style>
</head>

<body>

<div class="sidebar">
  <h3>🛡️ ORCA</h3>
  <button onclick="scan()">scan</button>
  <button onclick="help()">help</button>
  <button onclick="clearLog()">clear</button>
</div>

<div class="main">
  <div class="card">
    <input id="target" placeholder="https://target.com">
    <small>Passive reconnaissance · CLI style</small>
  </div>

  <div class="card">
    <pre id="out">$ orca ready</pre>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const PROXY="proxy.php?url=";

/* ================= CORE ================= */
const out=document.getElementById("out");
let log=["$ orca ready"];

const add=t=>{log.push(t);out.textContent=log.join("\n");};
const clearLog=()=>{log=["$ cleared"];out.textContent=log.join("\n");};

async function fetchProxy(url){
  try{return await fetch(PROXY+encodeURIComponent(url));}
  catch{return null;}
}

/* ================= HELP ================= */
function help(){
add(`
Commands
--------
scan     run scan
clear    clear output

Capabilities
------------
- CMS detection
- WordPress user enumeration
- Plugin fingerprint (HTML)
- Online CVE mapping
`);
}

/* ================= SCAN ================= */
async function scan(){
  clearLog();
  const base=target.value.replace(/\/$/,"");
  if(!base) return;

  add("$ scan "+base);
  add("");

  const home=await fetchProxy(base);
  if(!home){add("[-] target unreachable");return;}
  const html=await home.text();

  const cms=cmsDetect(html);
  await wpUsers(base,cms);
  const plugins=pluginFingerprint(html);
  await cveLookup(cms,plugins);

  add("");
  add("[+] scan completed");
}

/* ================= CMS DETECT ================= */
function cmsDetect(html){
  add("[*] CMS detection");
  if(/wp-content|wp-includes/i.test(html)){
    add("    CMS : WordPress");
    return "wordpress";
  }
  if(/Joomla!|\/components\//i.test(html)){
    add("    CMS : Joomla");
    return "joomla";
  }
  if(/Drupal|\/sites\/default\//i.test(html)){
    add("    CMS : Drupal");
    return "drupal";
  }
  if(/laravel|csrf-token/i.test(html)){
    add("    CMS : Laravel");
    return "laravel";
  }
  add("    CMS : Unknown");
  return "unknown";
}

/* ================= WP USERS ================= */
async function wpUsers(base,cms){
  if(cms!=="wordpress") return;

  add("");
  add("[*] WordPress users");

  const api=await fetchProxy(base+"/wp-json/wp/v2/users");
  let found=false;

  if(api && api.status===200){
    try{
      const j=await api.json();
      j.forEach(u=>{
        add("    user : "+u.slug+" (REST)");
        found=true;
      });
    }catch{}
  }

  for(let i=1;i<=10;i++){
    const r=await fetchProxy(base+"/?author="+i);
    if(r && r.url){
      const m=r.url.match(/\/author\/([^\/]+)/);
      if(m){
        add("    user : "+m[1]+" (author)");
        found=true;
      }
    }
  }

  if(!found) add("    no users discovered");
}

/* ================= PLUGIN FINGERPRINT ================= */
function pluginFingerprint(html){
  add("");
  add("[*] Plugin fingerprint");

  const plugins=[
    {name:"elementor",re:/elementor/i},
    {name:"revslider",re:/revslider/i},
    {name:"wp-file-manager",re:/wp-file-manager/i},
    {name:"woocommerce",re:/woocommerce/i}
  ];

  const detected=[];
  plugins.forEach(p=>{
    if(p.re.test(html)){
      detected.push(p.name);
      add("    "+p.name+" detected");
    }
  });

  if(!detected.length) add("    no known plugin detected");
  return detected;
}

/* ================= CVE ONLINE LOOKUP ================= */
async function cveLookup(cms,plugins){
  add("");
  add("[*] CVE mapping");

  if(!plugins.length){
    add("    nothing to map");
    return;
  }

  for(const p of plugins){
    add("    searching CVE for "+p+" ...");

    const api=`https://cve.circl.lu/api/search/${cms}/${p}`;
    const r=await fetchProxy(api);

    if(!r || r.status!==200){
      add("      CVE lookup failed");
      continue;
    }

    try{
      const j=await r.json();
      if(j.data && j.data.length){
        j.data.slice(0,3).forEach(c=>{
          add(`      ${c.id} | ${c.cvss || "N/A"} | ${c.summary}`);
        });
      }else{
        add("      no CVE found");
      }
    }catch{
      add("      parse error");
    }
  }
}
</script>

</body>
</html>
