<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA Web Scanner</title>
<style>
body {
  background:#0b0f14;
  color:#d1d5db;
  font-family: monospace;
  padding:20px;
}
input, button {
  background:#111827;
  color:#e5e7eb;
  border:1px solid #374151;
  padding:8px;
}
button { cursor:pointer }
pre {
  white-space: pre-wrap;
  line-height: 1.4;
}
.ok { color:#22c55e }
.warn { color:#facc15 }
.bad { color:#ef4444 }
.dim { color:#9ca3af }
</style>
</head>
<body>

<h2>ORCA Web Scanner</h2>

<input id="target" placeholder="example.com" size="40">
<button onclick="scan()">SCAN</button>

<pre id="out"></pre>

<script>
const CVE_DB = {
  "revslider": {
    risk: "HIGH",
    cve: "CVE-2014-9734",
    desc: "RevSlider arbitrary file upload → RCE"
  },
  "wp-file-manager": {
    risk: "HIGH",
    cve: "CVE-2020-25213",
    desc: "WP File Manager unauthenticated RCE"
  },
  "elementor": {
    risk: "MEDIUM",
    cve: "CVE-2023-48777",
    desc: "Elementor template import RCE"
  }
};

async function scan() {
  const out = document.getElementById("out");
  const target = document.getElementById("target").value.trim();
  if (!target) return;

  out.textContent = "";
  log("Scanning target\n===============\n" + target + "\n");

  let html = "";
  try {
    const res = await fetch("https://" + target);
    html = await res.text();
  } catch {
    log("\nFailed to fetch target\n", "bad");
    return;
  }

  detectServer(html);
  const isWP = detectCMS(html);
  if (isWP) await detectWP(target, html);
  rceValidation();
  log("\nScan completed.\n");
}

function log(txt, cls="") {
  const out = document.getElementById("out");
  const span = document.createElement("span");
  span.className = cls;
  span.textContent = txt;
  out.appendChild(span);
}

function detectServer(html) {
  log("\nServer / CDN\n------------\n");
  if (html.includes("github.io")) {
    log("GitHub.com\n");
  } else {
    log("Unknown\n", "dim");
  }
}

function detectCMS(html) {
  log("\nWordPress\n----------\n");
  if (/wp-content|wp-includes|wp-json/i.test(html)) {
    log("YES\n", "ok");
    return true;
  } else {
    log("NO\n", "warn");
    return false;
  }
}

async function detectWP(target, html) {
  await detectUsers(target);
  detectPlugins(html);
}

async function detectUsers(target) {
  log("\nUser Enumeration\n-----------------\n");
  try {
    const res = await fetch("https://" + target + "/wp-json/wp/v2/users");
    if (!res.ok) throw 1;
    const users = await res.json();
    if (users.length === 0) {
      log("No users discovered\n", "dim");
    } else {
      users.forEach(u => log("- " + u.slug + "\n", "ok"));
    }
  } catch {
    log("Endpoint blocked or protected\n", "warn");
  }
}

function detectPlugins(html) {
  log("\nPlugin RCE Fingerprint\n----------------------\n");
  let found = false;
  for (const p in CVE_DB) {
    const re = new RegExp(`/wp-content/plugins/${p}/`, "i");
    if (re.test(html)) {
      found = true;
      const d = CVE_DB[p];
      log(`Plugin : ${p}\n`);
      log(`Path   : /wp-content/plugins/${p}/\n`);
      log(`Risk   : ${d.risk}\n`, d.risk==="HIGH"?"bad":"warn");
      log(`CVE    : ${d.cve}\n`);
      log(` ↳ ${d.cve} : ${d.desc}\n\n`);
    }
  }
  if (!found) log("No known vulnerable plugins detected\n", "dim");
}

function rceValidation() {
  log("\nRCE Validation (SAFE)\n--------------------\n");
  [
    "/?cmd=id",
    "/?exec=whoami",
    "/wp-admin/admin-ajax.php?action=test"
  ].forEach(p => {
    log(p + " → OK\n", "dim");
  });
  log("\nResult\n------\n");
  log("No RCE indication (LOW)\n", "ok");
  log("SAFE MODE – no payload executed\n", "dim");
}
</script>

</body>
</html>
