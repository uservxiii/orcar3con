<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WebScan – WordPress</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0b1220;--panel:#121a2c;--text:#e9efff;--accent:#4f7cff}
.light{--bg:#f4f6fb;--panel:#ffffff;--text:#0b1220;--accent:#3b6cff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text);display:flex;height:100vh}
.sidebar{width:260px;background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:10px}
.sidebar h2{margin:0}
.sidebar button{padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;cursor:pointer}
.main{flex:1;padding:24px;overflow:auto}
.card{background:var(--panel);border-radius:18px;padding:18px;margin-bottom:16px}
input{width:100%;padding:12px;border-radius:10px;border:none;margin-bottom:8px}
pre{background:#0a1020;color:#cde;padding:16px;border-radius:14px;white-space:pre-wrap}
.light pre{background:#eef2ff;color:#111}
small{opacity:.7}
</style>
</head>
<body>

<div class="sidebar">
  <h2>🛡️ ORCA</h2>
  <button onclick="scan()">Scan Target</button>
  <button onclick="rceValidate()">RCE Test</button>
  <button onclick="toggleTheme()">🌗 Theme</button>
</div>

<div class="main">
  <h1>ORCA WebScan – WordPress</h1>

  <div class="card">
    <input id="target" placeholder="http://localhost">
    <small>Enter URL</small>
  </div>

  <div class="card">
    <pre id="out">Idle.</pre>
  </div>
</div>

<script>
/* ================= LOG BUFFER ================= */
const log=[];
const add=t=>log.push(t);
const render=()=>document.getElementById("out").textContent=log.join("\n");
const clearLog=()=>{log.length=0;};

/* ================= UI ================= */
const target=document.getElementById("target");
target.addEventListener("keydown",e=>{if(e.key==="Enter")scan();});
function toggleTheme(){document.body.classList.toggle("light");}

/* ================= SAFE FETCH ================= */
async function fetchSafe(u){
  try{return await fetch(u,{redirect:"manual"});}catch{return null;}
}

/* ================= PLUGIN FINGERPRINT ================= */
const pluginFingerprints=[
  {plugin:"revslider",path:"/wp-content/plugins/revslider/",cves:["CVE-2014-9734"],risk:"HIGH"},
  {plugin:"wp-file-manager",path:"/wp-content/plugins/wp-file-manager/",cves:["CVE-2020-25213"],risk:"HIGH"},
  {plugin:"elementor",path:"/wp-content/plugins/elementor/",cves:["CVE-2023-48777"],risk:"MEDIUM"}
];
const cveDB={
  "CVE-2014-9734":"RevSlider arbitrary file upload → RCE",
  "CVE-2020-25213":"WP File Manager unauthenticated RCE",
  "CVE-2023-48777":"Elementor template import RCE"
};

/* ================= MAIN SCAN ================= */
async function scan(){
  clearLog();
  const base=target.value.replace(/\/$/,"");
  if(!base) return;

  add("Scanning: "+base+"\n");
  render();

  const home=await fetchSafe(base);
  if(!home){add("Target unreachable");render();return;}
  const html=await home.text();

  add("Server / CDN");
  add(home.headers.get("server")||"hidden");
  if(home.headers.get("cf-ray")) add("Cloudflare detected");
  add("");

  add("WordPress detected: "+(/wp-content|wp-includes/i.test(html)?"YES":"NO"));
  add("");

  await enumUsers(base);   // Admin-priority
  await pluginScan(base);

  add("\nScan completed.");
  render();
}

/* ================= USER ENUM (Admin Priority) ================= */
async function enumUsers(base){
  add("User Enumeration");
  let users=new Set();
  let adminFound=false;

  // REST API
  const api=await fetchSafe(base+"/wp-json/wp/v2/users");
  if(api && api.status===200){
    try{
      const j=await api.json();
      j.forEach(u=>{
        users.add(u.slug);
        if(u.slug.toLowerCase()==="admin") adminFound=true;
      });
    }catch{}
  }

  // Author enum
  for(let i=1;i<=10;i++){
    const r=await fetchSafe(base+"/?author="+i);
    if(r && r.url){
      const m=r.url.match(/\/author\/([^\/]+)/);
      if(m){
        users.add(m[1]);
        if(m[1].toLowerCase()==="admin") adminFound=true;
      }
    }
  }

  if(adminFound) add("User: admin ⚠️ (PRIORITY)");
  users.forEach(u=>{
    if(u.toLowerCase()!=="admin") add("User: "+u);
  });
  if(users.size===0) add("No users discovered");
  add("");
  render();
}

/* ================= PLUGIN SCAN ================= */
async function pluginScan(base){
  add("Plugin RCE Fingerprint");
  let found=false;
  for(const p of pluginFingerprints){
    const r=await fetchSafe(base+p.path);
    if(!r) continue;
    found=true;
    add("Plugin : "+p.plugin);
    add("Path   : "+p.path);
    add("Risk   : "+p.risk);
    add("CVE    : "+p.cves.join(", "));
    p.cves.forEach(c=>add(" ↳ "+c+" : "+cveDB[c]));
    add("");
  }
  if(!found) add("No vulnerable plugin detected\n");
}

/* ================= RCE REAL ================= */
async function rceValidate(){
  const base=target.value.replace(/\/$/,"");
  if(!base) return;

  add("\nRCE Test");
  const tests=["/?cmd=id","/?exec=whoami","/wp-admin/admin-ajax.php?action=test"];
  let score=0;

  for(const t of tests){
    try{
      const r=await fetch(base+t);
      const txt=await r.text();
      if(/uid=|gid=|root:/i.test(txt)){
        add(t+" → EXECUTION SUCCESS [HIGH]");
        score+=3;
      }else if(/warning|fatal error/i.test(txt)){
        add(t+" → ERROR LEAK [MEDIUM]");
        score+=2;
      }else{
        add(t+" → RESPONSE OK");
      }
    }catch{
      add(t+" → BLOCKED / FAILED");
    }
  }

  add("\nResult");
  add(score>=5?"LIKELY RCE (HIGH)":
      score>=2?"POTENTIAL (MEDIUM)":
      "No RCE indication (LOW)");
  render();
}
</script>
  <script>
/* ================= ORCA UPGRADE PATCH ================= */

/* ---- STRONG WORDPRESS DETECTION ---- */
function isWordPress(html, headers){
  if(/wp-content|wp-includes|wp-emoji/i.test(html)) return true;
  if(headers.get("x-powered-by")?.toLowerCase().includes("wordpress")) return true;
  if(headers.get("link")?.includes("wp-json")) return true;
  return false;
}

/* ---- ADMIN ENUM VIA WP JSON (VALID) ---- */
async function enumUsersWPJSON(base){
  add("WP JSON User Enumeration (Enhanced)");

  const endpoints=[
    "/wp-json/wp/v2/users",
    "/wp-json/wp/v2/users?context=edit",
    "/wp-json/wp/v2/users/me"
  ];

  let found=false;

  for(const ep of endpoints){
    const r=await fetchSafe(base+ep);
    if(!r || r.status!==200) continue;

    try{
      const data=await r.json();
      const users=Array.isArray(data)?data:[data];

      users.forEach(u=>{
        const name=u.slug||u.name||"unknown";
        const roles=u.roles||[];
        if(roles.includes("administrator")){
          add("ADMIN FOUND : "+name+" ⚠️⚠️⚠️");
        }else{
          add("User : "+name);
        }
        found=true;
      });
    }catch{}
  }

  if(!found) add("WP JSON protected or no users exposed");
  add("");
  render();
}

/* ---- WRAP ORIGINAL SCAN (NO EDIT) ---- */
const originalScan = scan;
scan = async function(){
  clearLog();
  const base=target.value.replace(/\/$/,"");
  if(!base) return;

  add("Scanning: "+base+"\n");
  render();

  const home=await fetchSafe(base);
  if(!home){add("Target unreachable");render();return;}
  const html=await home.text();

  add("Server / CDN");
  add(home.headers.get("server")||"hidden");
  add("");

  const wp=isWordPress(html, home.headers);
  add("WordPress detected: "+(wp?"YES ✅":"NO ❌"));
  add("");

  if(wp){
    await enumUsersWPJSON(base);   // 🔥 ADMIN PRIORITY
  }

  await pluginScan(base);
  add("\nScan completed.");
  render();
};

/* ================= END PATCH ================= */
</script>

</body>
</html>
