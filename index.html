<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ORCA WPScan</title>
<style>
body{background:#1e1e1e;color:#d0d0d0;font-family:monospace}
#t{white-space:pre-wrap;padding:16px}
input,button{background:#111;color:#ddd;border:1px solid #555;padding:5px}
.green{color:#7CFC00}
.yellow{color:#ffcc66}
.red{color:#ff5c5c}
.gray{color:#888}
</style>
</head>
<body>

Target:
<input id="target" placeholder="https://example.com" size="35">
<button onclick="scan()">Scan</button>

<div id="t">ORCA – Admin Enumeration FIX
----------------------------------
</div>

<script>
const t=document.getElementById("t");
const log=(m,c="")=>{
  const s=document.createElement("span");
  if(c) s.className=c;
  s.textContent=m+"\n";
  t.appendChild(s);
};

async function fetchSafe(u){
  try{return await fetch(u,{redirect:"manual"})}catch{return null}
}

function clean(u){return u.replace(/\/$/,"")}

async function scan(){
  t.textContent="";
  const base=clean(document.getElementById("target").value);
  if(!base) return;

  log("[i] Starting admin enumeration","gray");
  await enumUsers(base);
  log("[+] Done","green");
}

/* ================= REAL ADMIN ENUM ================= */
async function enumUsers(base){
  log("[i] Enumerating users (admin priority)","gray");
  let found=false;

  /* 1️⃣ REST API users */
  const r=await fetchSafe(base+"/wp-json/wp/v2/users?per_page=100");
  if(r && r.status===200){
    try{
      const users=await r.json();
      users.forEach(u=>{
        const name=u.slug||u.name;
        if(name){
          if(name.toLowerCase()==="admin"){
            log(" [!] ADMIN FOUND: "+name,"red");
          }else{
            log(" [+] User: "+name,"yellow");
          }
          found=true;
        }
      });
    }catch{}
  }

  /* 2️⃣ REST users/me (kadang bocor role) */
  const me=await fetchSafe(base+"/wp-json/wp/v2/users/me");
  if(me && me.status===200){
    try{
      const u=await me.json();
      if(u.slug){
        log(" [!] users/me exposed: "+u.slug,"red");
        found=true;
      }
    }catch{}
  }

  /* 3️⃣ Author enumeration */
  for(let i=1;i<=10;i++){
    const a=await fetchSafe(base+"/?author="+i);
    if(a && a.url){
      const m=a.url.match(/\/author\/([^\/]+)/);
      if(m){
        const name=m[1];
        if(name.toLowerCase()==="admin"){
          log(" [!] ADMIN FOUND (author): "+name,"red");
        }else{
          log(" [+] User (author): "+name,"yellow");
        }
        found=true;
      }
    }
  }

  if(!found) log(" [-] No users exposed","green");
}
</script>

</body>
</html>
