<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ORCA WebScan</title>
<meta name="viewport" content="width=device-width">
<style>
body{margin:0;background:#0b1220;color:#e9efff;font-family:monospace}
.wrap{max-width:1100px;margin:auto;padding:20px}
input,button{font-family:monospace;padding:10px}
button{cursor:pointer}
pre{background:#050814;padding:16px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
<h1>ORCA WebScan</h1>

<input id="t" placeholder="https://target.tld" style="width:70%">
<button onclick="scan()">SCAN</button>

<pre id="out">Idle.</pre>
</div>

<script>
const out=document.getElementById("out");
const log=[];
const add=t=>log.push(t);
const render=()=>out.textContent=log.join("\n");
const clear=()=>log.length=0;

async function get(u){
  const r=await fetch("?fetch="+encodeURIComponent(u));
  if(!r.ok) return null;
  return r;
}

/* ================= SCAN ================= */
async function scan(){
  clear();
  const base=document.getElementById("t").value.replace(/\/$/,"");
  if(!base) return;

  add("Scanning target");
  add("===============");
  add(base+"\n");
  render();

  const r=await get(base);
  if(!r){ add("Target unreachable"); return render(); }

  const html=await r.text();
  const server=r.headers.get("server")||"hidden";

  add("Server / CDN");
  add("------------");
  add(server+"\n");

  /* CMS DETECT */
  let cms="Static / Other";
  if(/wp-content|wp-includes|wordpress/i.test(html)) cms="WordPress";
  else if(/Joomla!|com_content/i.test(html)) cms="Joomla";
  else if(/Drupal.settings|drupal/i.test(html)) cms="Drupal";

  add("CMS");
  add("---");
  add(cms+"\n");

  if(cms==="WordPress"){
    await wpUsers(base);
    await wpPlugins(html);
  }

  add("\nScan completed.");
  render();
}

/* ================= USERS ================= */
async function wpUsers(base){
  add("User Enumeration");
  add("-----------------");

  const r=await get(base+"/wp-json/wp/v2/users");
  if(!r || r.status!==200){
    add("No users discovered\n");
    return;
  }
  try{
    const j=await r.json();
    if(!j.length){ add("No users discovered\n"); return; }
    j.forEach(u=>add("User: "+u.slug));
    add("");
  }catch{
    add("No users discovered\n");
  }
}

/* ================= PLUGINS ================= */
const pluginDB={
  "revslider":{
    re:/revslider/i,
    cves:[
      ["CVE-2014-9734","RevSlider arbitrary file upload → RCE"]
    ]
  },
  "wp-file-manager":{
    re:/wp-file-manager/i,
    cves:[
      ["CVE-2020-25213","Unauthenticated file upload → RCE"]
    ]
  },
  "elementor":{
    re:/elementor/i,
    cves:[
      ["CVE-2023-48777","Template import → code execution"]
    ]
  }
};

async function wpPlugins(html){
  add("Plugin RCE Fingerprint");
  add("----------------------");

  let found=false;
  for(const p in pluginDB){
    if(pluginDB[p].re.test(html)){
      found=true;
      add("Plugin : "+p);
      pluginDB[p].cves.forEach(c=>{
        add("CVE    : "+c[0]);
        add(" ↳ "+c[1]);
      });
      add("");
    }
  }
  if(!found) add("No plugin fingerprint detected\n");
}
</script>
</body>
</html>
