<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WebScan – WordPress LAB</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0b1220;
  --panel:#121a2c;
  --text:#e9efff;
  --accent:#4f7cff;
}
.light{
  --bg:#f4f6fb;
  --panel:#ffffff;
  --text:#0b1220;
  --accent:#3b6cff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}
.sidebar{
  width:230px;
  background:var(--panel);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.sidebar h2{margin:0}
.sidebar button{
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}
.sidebar .ghost{
  background:transparent;
  color:var(--text);
  border:1px solid var(--accent);
}
.main{
  flex:1;
  padding:24px;
  overflow:auto;
}
.card{
  background:var(--panel);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
}
input{
  width:100%;
  padding:14px;
  margin-top:8px;
  border-radius:12px;
  border:none;
  font-size:15px;
}
pre{
  background:#0a1020;
  color:#cde;
  padding:16px;
  border-radius:14px;
  white-space:pre-wrap;
}
.light pre{background:#eef2ff;color:#111}
small{opacity:.7}
</style>
</head>

<body>

<div class="sidebar">
  <h2>🛡️ ORCA</h2>
  <button onclick="scan()">Scan Target</button>
  <button class="ghost" onclick="bruteForce()">Brute Force (LAB)</button>
  <button class="ghost" onclick="toggleTheme()">🌗 Light / Dark</button>
</div>

<div class="main">
  <h1>ORCA WebScan – WordPress LAB</h1>

  <div class="card">
    <input id="target" placeholder="example.com (press ENTER)" />
  </div>

  <!-- BRUTE FORCE -->
  <div class="card" id="bruteCard" style="display:none">
    <h3>Brute Force LAB</h3>

    <input id="loginUrl" placeholder="Login URL (https://target/wp-login.php)" />

    <small>Username</small>
    <input id="singleUser" placeholder="Single username (optional)" />
    <input type="file" id="userWL" accept=".txt" />

    <small>Password</small>
    <input id="singlePass" placeholder="Single password (optional)" />
    <input type="file" id="passWL" accept=".txt" />

    <button style="margin-top:12px" onclick="runBruteLab()">Run LAB Simulation</button>
  </div>

  <div class="card">
    <pre id="out">Idle.</pre>
  </div>
</div>

<script>
/* ================= CORE ================= */
const PROXY="https://r.jina.ai/http://";
const out=t=>document.getElementById("out").textContent=t;
const clean=d=>d.replace(/^https?:\/\//,'').replace(/\/.*$/,'');

target.addEventListener("keydown",e=>{
  if(e.key==="Enter") scan();
});

async function hybridFetch(url,timeout=7000){
  const c=new AbortController();
  setTimeout(()=>c.abort(),timeout);
  try{
    return {res:await fetch(url,{signal:c.signal}),mode:"direct"};
  }catch{
    try{
      return {res:await fetch(PROXY+url.replace(/^https?:\/\//,'')),mode:"proxy"};
    }catch{return null;}
  }
}

/* ================= SCAN ================= */
async function scan(){
  const domain=clean(target.value.trim());
  if(!domain) return;
  out("Scanning...");
  let log=`Target\n------\n${domain}\n\n`;
  const base="https://"+domain;

  /* HOME */
  const home=await hybridFetch(base);
  if(!home){out("Target unreachable");return;}
  const html=await home.res.text();

  log+=`Fetch Mode\n----------\n${home.mode}\n\n`;

  /* WP DETECT */
  log+=`WordPress Detected\n------------------\n${/wp-content|wp-includes/i.test(html)?"YES":"NO"}\n\n`;

  /* ADMIN */
  log+=`Admin Paths\n-----------\n`;
  for(const p of ["/wp-login.php","/wp-admin/"]){
    const r=await hybridFetch(base+p);
    log+=`${p} => ${r?r.res.status:"blocked"}\n`;
  }

  /* XMLRPC */
  const xr=await hybridFetch(base+"/xmlrpc.php");
  log+=`\nXML-RPC\n-------\n${xr?xr.res.status:"blocked"}\n`;

  /* USER ENUM */
  log+=`\nUser Enumeration (REST)\n----------------------\n`;
  const rest=await hybridFetch(base+"/wp-json/wp/v2/users");
  if(rest && rest.res.status===200){
    try{
      const d=await rest.res.json();
      if(d.length){
        log+="EXPOSED\n";
        d.forEach(u=>{
          log+=` - ${u.slug} (id:${u.id})\n`;
        });
      }else{
        log+="No users returned\n";
      }
    }catch{
      log+="JSON filtered\n";
    }
  }else{
    log+=`Protected (${rest?rest.res.status:"blocked"})\n`;
  }

  /* PLUGINS */
  const plugins=[...new Set(
    [...html.matchAll(/wp-content\/plugins\/([a-z0-9-_]+)/gi)].map(m=>m[1])
  )];
  log+=`\nPlugins (Passive)\n-----------------\n${plugins.join(", ")||"None"}\n`;

  log+="\nScan Mode\n---------\nHybrid Passive Scan\n";
  out(log);
}

/* ================= BRUTE FORCE LAB ================= */
let userList=[], passList=[];
let defaultWL=["admin","password","admin123","qwerty","123456","welcome"];

function bruteForce(){
  document.getElementById("bruteCard").style.display="block";
  out("Brute Force LAB ready.");
}

userWL.addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>userList=r.result.split(/\r?\n/).filter(x=>x);
  r.readAsText(f);
});

passWL.addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>passList=r.result.split(/\r?\n/).filter(x=>x);
  r.readAsText(f);
});

function runBruteLab(){
  const url=loginUrl.value.trim();
  if(!url) return out("Login URL required");

  const users = singleUser.value ? [singleUser.value] : userList.length ? userList : ["admin"];
  const passes = singlePass.value ? [singlePass.value] : passList.length ? passList : defaultWL;

  let log=
`Brute Force LAB Simulation
--------------------------
Login URL : ${url}
Users     : ${users.length}
Passwords : ${passes.length}

Sample Attempts
---------------\n`;

  users.slice(0,3).forEach(u=>{
    passes.slice(0,3).forEach(p=>{
      log+=`POST ${url} | ${u}:${p}\n`;
    });
  });

  log+=`
Status
------
SAFE MODE
No request sent
`;
  out(log);
}

/* ================= THEME ================= */
function toggleTheme(){
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
