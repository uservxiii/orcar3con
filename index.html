<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebScan ORCA (Valid Template Injection)</title>
<style>
    :root{
        --navy: #0b1d3a;
        --navy2: #0f2a55;
        --white: #ffffff;
        --gray: #f4f6fb;
        --text: #0b1d3a;
        --muted: #6b7a8a;
        --border: #e0e6f2;
        --shadow: rgba(11, 29, 58, 0.12);
        --green: #1a8a6a;
        --red: #d32f2f;
    }

    *{ box-sizing: border-box; }
    body{
        margin:0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--gray);
        color: var(--text);
    }

    .container{
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
    }

    .header{
        text-align: center;
        padding: 20px 0;
    }

    h1{
        margin: 0;
        font-size: 26px;
        color: var(--navy);
    }

    p{
        margin: 5px 0 0 0;
        color: var(--muted);
    }

    .card{
        background: var(--white);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px var(--shadow);
        border: 1px solid var(--border);
    }

    .form-group{
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    input{
        flex: 1;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 16px;
        outline: none;
    }

    button{
        padding: 12px 16px;
        border-radius: 12px;
        border: none;
        background: var(--navy);
        color: var(--white);
        font-size: 16px;
        cursor: pointer;
        min-width: 140px;
    }

    button:hover{
        background: var(--navy2);
    }

    .result{
        margin-top: 20px;
        background: #f7f9ff;
        padding: 15px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 14px;
        color: #0b1d3a;
    }

    .code{
        margin-top: 10px;
        background: #0b1d3a;
        color: #fff;
        padding: 12px;
        border-radius: 12px;
        font-family: monospace;
        font-size: 13px;
        white-space: pre-wrap;
    }

    .status {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 12px;
    }
    .ok { background: var(--green); color: #fff; }
    .bad { background: var(--red); color: #fff; }

    .loading{
        display:none;
        margin-top: 12px;
        text-align:center;
    }

    .spinner{
        border: 4px solid #d7e2f5;
        border-top: 4px solid var(--navy);
        border-radius: 50%;
        width: 28px;
        height: 28px;
        animation: spin 1s linear infinite;
        margin: auto;
    }

    @keyframes spin{
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @media (max-width: 600px){
        h1{ font-size: 22px; }
        .form-group{ flex-direction: column; }
        button{ width: 100%; }
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>WebScan ORCA</h1>
        <p>Validasi Template Injection (safe, non-exploit)</p>
    </div>

    <div class="card">
        <form id="scanForm">
            <div class="form-group">
                <input id="target" type="text" placeholder="domain.com" />
                <button type="submit">Scan</button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 8px; color: var(--muted);">Scanning...</p>
        </div>

        <div class="result" id="result"></div>
    </div>
</div>

<script>
function normalizeUrl(url){
    url = url.trim();
    if(!url.startsWith("http")){
        url = "http://" + url;
    }
    return url.replace(/\/+$/, "");
}

function randId(){
    return Math.floor(Math.random() * 1000000);
}

async function fetchText(url){
    try{
        const res = await fetch(url);
        const text = await res.text();
        return {status: res.status, url: res.url, text};
    }catch(e){
        return {status: null, url: null, text: e.message};
    }
}

function buildPayloads(id){
    return [
        {name: "Handlebars/Jinja", payload: `{{"ORCA-${id}"}}`},
        {name: "JS Template", payload: `${"ORCA-" + id}`},  // this is just plain text for safety
        {name: "ERB/Ruby", payload: `<%= "ORCA-${id}" %>`}
    ];
}

async function scan(target){
    target = normalizeUrl(target);

    const id = randId();
    const payloads = buildPayloads(id);

    let results = [];
    let successCount = 0;

    // base check
    const base = await fetchText(target);

    // probe each payload
    for(const p of payloads){
        const res = await fetchText(target + "?test=" + encodeURIComponent(p.payload));
        const ok = res.text.includes(`ORCA-${id}`);
        if(ok) successCount++;

        results.push({
            engine: p.name,
            payload: p.payload,
            found: ok,
            status: res.status
        });
    }

    const confirmed = successCount >= 2;

    return {
        target,
        status: base.status,
        confirmed,
        successCount,
        id,
        results
    };
}

const form = document.getElementById("scanForm");
const result = document.getElementById("result");
const loading = document.getElementById("loading");

form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const target = document.getElementById("target").value;
    if(!target) return;

    loading.style.display = "block";
    result.innerHTML = "";

    const data = await scan(target);

    loading.style.display = "none";

    let html = "";
    html += `<div>Status: <span class="status ${data.confirmed ? 'ok' : 'bad'}">${data.confirmed ? 'CONFIRMED' : 'NOT CONFIRMED'}</span></div>`;
    html += `<div style="margin-top:8px;">Target: <b>${data.target}</b></div>`;
    html += `<div style="margin-top:8px;">Success: <b>${data.successCount}</b> / 3</div>`;

    html += `<div class="code">`;
    html += JSON.stringify(data, null, 2);
    html += `</div>`;

    result.innerHTML = html;
});
</script>
</body>
</html>
