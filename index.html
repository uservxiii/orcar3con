<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORCA WebScan</title>

<style>
:root{
  --navy:#0b1d3a;--bg:#f4f6fb;--card:#fff;--border:#e0e6f2;
}
body{margin:0;font-family:system-ui;background:var(--bg)}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:var(--card);border-radius:18px;padding:20px;border:1px solid var(--border)}
.row{display:flex;gap:10px}
input,textarea,select,button{
  padding:12px;border-radius:12px;border:1px solid var(--border);width:100%;
}
button{background:var(--navy);color:#fff;cursor:pointer}
.section{margin-top:15px;padding:15px;border:1px solid var(--border);border-radius:14px}
.progress{height:10px;background:#ddd;border-radius:6px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--navy)}
pre{background:#eee;padding:12px;border-radius:10px;white-space:pre-wrap}
.hidden{display:none}
</style>
</head>

<body>
<div class="container">
<h1>ORCA WebScan</h1>

<div class="card">

  <div class="row">
    <input id="target" placeholder="example.com">
    <button onclick="run()">Scan</button>
    <button onclick="toggleTheme()">Theme</button>
  </div>

  <div class="progress"><div id="bar"></div></div>

  <div class="section">
    <h2>Results</h2>
    <div id="output">No scan yet.</div>
  </div>

  <div class="section">
    <h2>Details</h2>
    <pre id="details">-</pre>
  </div>

  <div class="section">
    <button onclick="toggleLab()">Toggle LAB Mode</button>
  </div>

  <!-- LAB MODE -->
  <div id="lab" class="section hidden">
    <h2>LAB Mode</h2>

    <input id="labEndpoint" placeholder="/search?q=">
    <select id="labMethod">
      <option>GET</option>
      <option>POST</option>
    </select>
    <textarea id="labPayload" placeholder="payload"></textarea>

    <div class="row">
      <button onclick="labTest()">Send</button>
    </div>

    <pre id="labOut">Lab output…</pre>
  </div>

  <div class="section">
    <button onclick="exportReport()">Export JSON</button>
    <button onclick="clearHistory()">Clear History</button>
  </div>

  <div class="section">
    <h2>History</h2>
    <pre id="historyOut">No history</pre>
  </div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
