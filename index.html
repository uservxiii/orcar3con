<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebScan ORCA</title>
<style>
    :root{
        --navy: #0b1d3a;
        --navy2: #0f2a55;
        --white: #ffffff;
        --gray: #f4f6fb;
        --text: #0b1d3a;
        --muted: #6b7a8a;
        --border: #e0e6f2;
        --shadow: rgba(11, 29, 58, 0.12);
        --good: #1f7a1f;
        --warn: #d9a700;
        --bad: #d11a2a;
    }

    *{ box-sizing: border-box; }
    body{
        margin:0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--gray);
        color: var(--text);
    }

    .container{
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
    }

    .header{
        text-align: center;
        padding: 20px 0;
    }

    h1{
        margin: 0;
        font-size: 26px;
        color: var(--navy);
    }

    p{
        margin: 5px 0 0 0;
        color: var(--muted);
    }

    .card{
        background: var(--white);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px var(--shadow);
        border: 1px solid var(--border);
        margin-top: 15px;
    }

    .form-group{
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    input{
        flex: 1;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 16px;
        outline: none;
    }

    button{
        padding: 12px 16px;
        border-radius: 12px;
        border: none;
        background: var(--navy);
        color: var(--white);
        font-size: 16px;
        cursor: pointer;
        min-width: 140px;
    }

    button:hover{
        background: var(--navy2);
    }

    .loading{
        display:none;
        margin-top: 12px;
        text-align:center;
    }

    .spinner{
        border: 4px solid #d7e2f5;
        border-top: 4px solid var(--navy);
        border-radius: 50%;
        width: 28px;
        height: 28px;
        animation: spin 1s linear infinite;
        margin: auto;
    }

    @keyframes spin{
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .grid{
        display:grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 15px;
    }

    .badge{
        display:inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--navy);
        background: #f6f7ff;
    }

    .score{
        font-size: 20px;
        font-weight: bold;
    }

    .good{ color: var(--good); }
    .warn{ color: var(--warn); }
    .bad{ color: var(--bad); }

    table{
        width:100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th, td{
        padding: 10px;
        border-bottom: 1px solid var(--border);
        text-align:left;
    }

    th{
        background: #f6f8ff;
        font-weight: 600;
    }

    @media (max-width: 700px){
        .grid{
            grid-template-columns: 1fr;
        }
        h1{ font-size: 22px; }
        .form-group{ flex-direction: column; }
        button{ width: 100%; }
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>WebScan ORCA</h1>
        <p>Masukkan domain saja. Contoh: <b>domain.com</b></p>
    </div>

    <div class="card">
        <form id="scanForm">
            <div class="form-group">
                <input id="target" type="text" placeholder="domain.com" />
                <button type="submit">Scan</button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 8px; color: var(--muted);">Scanning...</p>
        </div>

        <div id="output" style="display:none;">
            <div class="grid">
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-size:14px; color:var(--muted)">Target</div>
                            <div style="font-weight:700; font-size:16px" id="outTarget"></div>
                        </div>
                        <div id="outStatus" class="badge"></div>
                    </div>
                    <div style="margin-top:10px;">
                        <div style="font-size:14px; color:var(--muted)">Risk Score</div>
                        <div class="score" id="outScore"></div>
                    </div>
                </div>

                <div class="card">
                    <div style="font-size:14px; color:var(--muted)">Fingerprint (WhatWeb-like)</div>
                    <div style="margin-top:10px;" id="outFingerprint"></div>
                </div>
            </div>

            <div class="card">
                <div style="font-size:14px; color:var(--muted)">Template Injection Probe</div>
                <table>
                    <thead>
                        <tr><th>Payload</th><th>Result</th></tr>
                    </thead>
                    <tbody id="tableTemplate"></tbody>
                </table>
            </div>

            <div class="card">
                <div style="font-size:14px; color:var(--muted)">DNS Lookup (A Record)</div>
                <table>
                    <thead>
                        <tr><th>IP</th><th>TTL</th></tr>
                    </thead>
                    <tbody id="tableDNS"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script>
function normalizeUrl(url){
    url = url.trim();
    if(!url.startsWith("http")){
        url = "http://" + url;
    }
    return url.replace(/\/+$/, "");
}

async function fetchText(url){
    try{
        const res = await fetch(url);
        const text = await res.text();
        return {status: res.status, url: res.url, headers: res.headers, text};
    }catch(e){
        return {status: null, url: null, headers: null, text: e.message};
    }
}

async function nslookup(domain){
    const url = `https://dns.google/resolve?name=${domain}&type=A`;
    try{
        const res = await fetch(url);
        const data = await res.json();
        return data;
    }catch(e){
        return {error: e.message};
    }
}

function fingerprintFromHeaders(headers, body){
    const server = headers.get("server") || "";
    const powered = headers.get("x-powered-by") || "";
    const generator = (body.match(/<meta name="generator" content="([^"]+)"/i) || [])[1] || "";

    const patterns = [
        {name: "WordPress", check: /wp-content|wp-includes/i},
        {name: "Joomla", check: /Joomla!/i},
        {name: "Drupal", check: /drupal/i},
        {name: "Laravel", check: /laravel/i},
        {name: "React", check: /<div id="root">/i},
        {name: "Angular", check: /ng-app/i},
        {name: "Vue.js", check: /<div id="app">/i}
    ];

    let detected = [];
    for(const p of patterns){
        if(p.check.test(body)) detected.push(p.name);
    }

    if(generator) detected.push(generator);

    return {
        server,
        powered,
        generator,
        detected: detected.length ? detected : ["Unknown"]
    };
}

function calcRisk(template){
    let score = 0;
    for(const k in template){
        if(template[k]) score += 40;
    }
    return score;
}

async function scan(target){
    target = normalizeUrl(target);
    const domain = target.replace(/^https?:\/\//, "");

    const probes = ["{{7*7}}", "${7*7}", "<%=7*7%>"];
    let template = {};

    const base = await fetchText(target);

    for(const p of probes){
        const res = await fetchText(target + "?test=" + encodeURIComponent(p));
        template[p] = res.text.includes("49");
    }

    const fp = fingerprintFromHeaders(base.headers, base.text);
    const dns = await nslookup(domain);
    const score = calcRisk(template);

    return {target, base, template, fp, dns, score};
}

/* UI Rendering */
const form = document.getElementById("scanForm");
const loading = document.getElementById("loading");
const output = document.getElementById("output");

form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const target = document.getElementById("target").value;
    if(!target) return;

    loading.style.display = "block";
    output.style.display = "none";

    const data = await scan(target);

    loading.style.display = "none";
    output.style.display = "block";

    document.getElementById("outTarget").innerText = data.target;
    document.getElementById("outStatus").innerText = data.base.status || "ERR";

    // score color
    const scoreEl = document.getElementById("outScore");
    scoreEl.innerText = data.score;
    scoreEl.className = data.score >= 40 ? "score bad" : data.score > 0 ? "score warn" : "score good";

    // fingerprint
    document.getElementById("outFingerprint").innerHTML = `
        <div><b>Server:</b> ${data.fp.server || "-"}</div>
        <div><b>Powered:</b> ${data.fp.powered || "-"}</div>
        <div><b>Detected:</b> ${data.fp.detected.join(", ")}</div>
    `;

    // template table
    const tpl = document.getElementById("tableTemplate");
    tpl.innerHTML = "";
    for(const k in data.template){
        tpl.innerHTML += `<tr><td>${k}</td><td>${data.template[k] ? "YES" : "NO"}</td></tr>`;
    }

    // dns table
    const dnsTable = document.getElementById("tableDNS");
    dnsTable.innerHTML = "";
    if(data.dns.Answer){
        data.dns.Answer.forEach(a => {
            dnsTable.innerHTML += `<tr><td>${a.data}</td><td>${a.TTL}</td></tr>`;
        });
    } else {
        dnsTable.innerHTML = `<tr><td colspan="2">${data.dns.error || "No record found"}</td></tr>`;
    }
});
</script>
</body>
</html>
