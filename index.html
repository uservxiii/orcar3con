<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WebScan – WordPress LAB (Next Level)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:system-ui;background:#0b1220;color:#e9efff}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:#121a2c;border-radius:16px;padding:18px;margin-bottom:16px}
input,button{padding:12px;border-radius:10px;border:none;font-size:16px}
input{width:70%}
button{background:#4f7cff;color:#fff;cursor:pointer}
pre{background:#0a1020;padding:14px;border-radius:10px;overflow:auto;white-space:pre-wrap}
h1{margin-top:0}
.badge{padding:4px 8px;border-radius:6px;font-size:12px}
.ok{background:#0a6}
.warn{background:#a80}
.err{background:#a00}
</style>
</head>
<body>

<div class="container">
<h1>🛡️ ORCA WebScan – WordPress LAB (Next Level)</h1>

<div class="card">
<input id="target" placeholder="example.com">
<button onclick="scan()">Scan</button>
</div>

<div class="card">
<pre id="out">Idle.</pre>
</div>
</div>

<script>
// ================== OFFLINE CVE DB ==================
const CVE_DB = {
  core:{
    "6.2":["CVE-2023-2745"],
    "5.9":["CVE-2022-21661"]
  },
  plugins:{
    "contact-form-7":["CVE-2020-35489"],
    "elementor":["CVE-2023-48777"],
    "woocommerce":["CVE-2021-32790"]
  },
  themes:{
    "twentytwentyone":["CVE-2021-39200"]
  }
};

// ================== HELPERS ==================
const clean = d=>d.replace(/^https?:\/\//,'').replace(/\/.*$/,'');
const out = t=>document.getElementById("out").textContent=t;

async function safeFetch(url){
  try{ return await fetch(url); }catch{ return null; }
}

// ================== MAIN SCAN ==================
async function scan(){
  const domain = clean(target.value.trim());
  if(!domain) return;
  out("Scanning...");

  let log=`Target\n------\n${domain}\n\n`;

  const base = "https://" + domain;
  const res = await safeFetch(base);
  if(!res){ out("Failed to connect."); return; }

  const html = await res.text();
  const headers = {};
  res.headers.forEach((v,k)=>headers[k]=v);

  // ===== WordPress detect =====
  const isWP = /wp-content|wp-includes/i.test(html);
  log+=`WordPress Detected\n------------------\n${isWP?"YES":"NO"}\n\n`;

  // ===== Version detect =====
  let version="Not provided";
  const v = html.match(/generator.+wordpress\s([0-9.]+)/i);
  if(v) version=v[1];
  log+=`WordPress Version\n----------------\n${version}\n\n`;

  // ===== Admin login =====
  log+="Admin Login Paths\n-----------------\n";
  for(const p of ["/wp-login.php","/wp-admin/"]){
    const r = await safeFetch(base+p);
    log+=`${p} => ${r?r.status:"blocked"}\n`;
  }

  // ===== xmlrpc =====
  log+="\nXML-RPC Check\n-------------\n";
  const xr = await safeFetch(base+"/xmlrpc.php");
  log+=xr?`xmlrpc.php => ${xr.status}\n`:"xmlrpc blocked\n";

  // ===== wp-json mapper =====
  log+="\nwp-json Endpoint Mapper\n----------------------\n";
  const endpoints=[
    "/wp-json/","/wp-json/wp/v2/users",
    "/wp-json/wp/v2/posts",
    "/wp-json/wp/v2/pages"
  ];
  for(const e of endpoints){
    const r = await safeFetch(base+e);
    log+=`${e} => ${r?r.status:"blocked"}\n`;
  }

  // ===== Passive user enum =====
  log+="\nPassive User Enumeration\n------------------------\n";
  const u = await safeFetch(base+"/?author=1");
  log+=u && u.url.includes("/author/") ? "Author archive exposed\n" : "Author enum protected\n";

  // ===== Plugin detect =====
  const plugins=[...new Set(
    [...html.matchAll(/wp-content\/plugins\/([a-z0-9-_]+)/gi)]
    .map(m=>m[1])
  )];
  log+="\nPlugins Detected\n----------------\n";
  log+=plugins.length?plugins.join(", ")+"\n":"None\n";

  // ===== Theme detect =====
  let theme="Unknown";
  const t = html.match(/wp-content\/themes\/([a-z0-9-_]+)/i);
  if(t) theme=t[1];
  log+=`\nTheme Detected\n--------------\n${theme}\n`;

  // ===== Security headers =====
  const secHeaders=[
    "content-security-policy",
    "strict-transport-security",
    "x-frame-options",
    "x-content-type-options",
    "referrer-policy"
  ];
  let score=0;
  log+="\nSecurity Headers\n----------------\n";
  secHeaders.forEach(h=>{
    if(headers[h]){ log+=`${h}: present\n`; score+=10; }
    else log+=`${h}: missing\n`;
  });
  log+=`\nHeader Score: ${score}/50\n`;

  // ===== CVE match =====
  log+="\n[ Core CVE Match ]\n-----------------\n";
  log+=CVE_DB.core[version]?.join(", ")||"None";
  log+="\n\n[ Plugin CVE Match ]\n-------------------\n";
  let pc=[];
  plugins.forEach(p=>{
    if(CVE_DB.plugins[p]) pc.push(`${p}: ${CVE_DB.plugins[p].join(", ")}`);
  });
  log+=pc.length?pc.join("\n"):"None";
  log+="\n\n[ Theme CVE Match ]\n------------------\n";
  log+=CVE_DB.themes[theme]?.join(", ")||"None";

  log+="\n\nScan Mode\n---------\nPassive LAB Scan (No Exploit)\n";

  out(log);
}
</script>
</body>
</html>
