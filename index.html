<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORCA WebScan - NEW</title>
<style>
:root{
  --bg:#f6f8ff;
  --card:#ffffff;
  --text:#0b1d3a;
  --muted:#5f6f89;
  --border:#e0e6f2;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  --primary:#0b1d3a;
}
[data-theme="dark"]{
  --bg:#0b1020;
  --card:#0f172a;
  --text:#e9efff;
  --muted:#aab6d1;
  --border:#1b2436;
  --shadow:0 12px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text);}
.container{display:flex;height:100vh;}
.sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);padding:20px;box-shadow:var(--shadow);}
.brand{font-weight:800;font-size:18px;margin-bottom:18px;}
.menu{list-style:none;padding:0;margin:0;}
.menu li{margin-bottom:8px;}
.menu button{
  width:100%;
  text-align:left;
  padding:12px 14px;
  border:none;
  border-radius:12px;
  background:transparent;
  cursor:pointer;
  font-size:15px;
  color:var(--text);
}
.menu button.active{background:rgba(11,29,58,.08);}
.main{flex:1;padding:20px;overflow:auto;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.header h1{margin:0;font-size:20px;}
.btn{padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text);}
.btn.primary{background:var(--primary);color:#fff;border:none;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
input,textarea,select{padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);width:100%;}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;}
pre{background:rgba(11,29,58,.06);padding:14px;border-radius:12px;overflow:auto;white-space:pre-wrap;}
[data-theme="dark"] pre{background:rgba(233,239,255,.06);}
.hidden{display:none;}
.log{background:rgba(11,29,58,.05);padding:10px;border-radius:12px;height:120px;overflow:auto;font-size:13px;}
[data-theme="dark"] .log{background:rgba(233,239,255,.05);}
.progress{height:10px;background:rgba(11,29,58,.08);border-radius:12px;overflow:hidden;margin:10px 0 12px;}
.progress>div{height:100%;width:0;background:var(--primary);}
.footer{color:var(--muted);font-size:13px;margin-top:10px;text-align:center;}
</style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <div class="brand">ORCA WebScan</div>
    <ul class="menu">
      <li><button class="active" data-tab="scan">Scan</button></li>
      <li><button data-tab="lab">Lab</button></li>
      <li><button data-tab="brute">Brute</button></li>
      <li><button data-tab="history">History</button></li>
    </ul>
    <div style="margin-top:18px;">
      <button class="btn" id="themeBtn">Toggle Theme</button>
      <button class="btn" id="exportBtn">Export JSON</button>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <h1 id="title">Scan</h1>
      <div class="row">
        <input id="target" placeholder="domain.com" style="width:260px">
        <button class="btn primary" id="scanBtn">Scan</button>
      </div>
    </div>

    <div class="progress"><div id="bar"></div></div>
    <div class="log" id="statusLog"></div>

    <!-- SCAN -->
    <div id="tab-scan" class="tab">
      <div class="card"><h2>Result</h2><div id="output">No scan yet</div></div>
      <div class="card"><h2>Details</h2><div id="details">No details yet</div></div>
    </div>

    <!-- LAB -->
    <div id="tab-lab" class="tab hidden">
      <div class="card">
        <h2>Lab</h2>
        <div class="row">
          <input id="labEndpoint" placeholder="/path?param=">
          <select id="labMethod"><option>GET</option><option>POST</option></select>
        </div>
        <textarea id="labPayload" rows="4" placeholder="payload" style="margin-top:10px"></textarea>
        <button class="btn primary" id="labRunBtn" style="margin-top:10px">Run</button>
      </div>
      <div class="card"><h2>Output</h2><pre id="labOut">No output yet</pre></div>
    </div>

    <!-- BRUTE -->
    <div id="tab-brute" class="tab hidden">
      <div class="card">
        <h2>Admin Brute</h2>
        <input type="file" id="adminWordlistFile">
        <div class="row" style="margin-top:10px">
          <button class="btn primary" id="adminBtn">Start</button>
          <button class="btn" id="pauseAdminBtn">Pause</button>
          <button class="btn" id="resumeAdminBtn">Resume</button>
        </div>
        <pre id="adminOut">No output yet</pre>
      </div>

      <div class="card">
        <h2>Dir Brute</h2>
        <input type="file" id="dirWordlistFile">
        <div class="row" style="margin-top:10px">
          <button class="btn primary" id="dirBtn">Start</button>
          <button class="btn" id="pauseDirBtn">Pause</button>
          <button class="btn" id="resumeDirBtn">Resume</button>
        </div>
        <pre id="dirOut">No output yet</pre>
      </div>

      <div class="card">
        <h2>Sub Brute</h2>
        <input type="file" id="subWordlistFile">
        <div class="row" style="margin-top:10px">
          <button class="btn primary" id="subBtn">Start</button>
          <button class="btn" id="pauseSubBtn">Pause</button>
          <button class="btn" id="resumeSubBtn">Resume</button>
        </div>
        <pre id="subOut">No output yet</pre>
      </div>
    </div>

    <!-- HISTORY -->
    <div id="tab-history" class="tab hidden">
      <div class="card">
        <h2>History</h2>
        <button class="btn" id="clearHistoryBtn">Clear</button>
        <pre id="historyOut">No history</pre>
      </div>
    </div>

    <div class="footer">ORCA WebScan • NEW version</div>
  </div>
</div>

<script>
const PROXY = "https://r.jina.ai/http://"; // proxy (must be online)

let lastReport = null;
let bruteState = {
  admin:{running:false,index:0,list:[],found:[]},
  dir:{running:false,index:0,list:[],found:[]},
  sub:{running:false,index:0,list:[],found:[]}
};

const el = {
  bar:()=>document.getElementById("bar"),
  output:()=>document.getElementById("output"),
  details:()=>document.getElementById("details"),
  log:()=>document.getElementById("statusLog"),
  history:()=>document.getElementById("historyOut"),
  labOut:()=>document.getElementById("labOut"),
};

function log(msg){
  const l=el.log();
  l.textContent=`${new Date().toLocaleTimeString()} - ${msg}\n` + l.textContent;
}
function clean(d){ return d.trim().replace(/^https?:\/\//,'').replace(/\/+$/,''); }
function setProgress(p){ el.bar().style.width = p + "%"; }
function setTab(tab){
  document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));
  document.querySelector(`[data-tab="${tab}"]`).classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.add("hidden"));
  document.getElementById("tab-"+tab).classList.remove("hidden");
  document.getElementById("title").textContent = tab.charAt(0).toUpperCase()+tab.slice(1);
}
function toggleTheme(){
  const r=document.documentElement;
  r.setAttribute("data-theme", r.getAttribute("data-theme")==="dark"?"light":"dark");
}

function saveHistory(r){
  const h = JSON.parse(localStorage.getItem("orca_history")||"[]");
  h.unshift({time:new Date().toISOString(), report:r});
  localStorage.setItem("orca_history", JSON.stringify(h.slice(0,20)));
  renderHistory();
}
function renderHistory(){
  const h = JSON.parse(localStorage.getItem("orca_history")||"[]");
  el.history().textContent = h.length ? h.map(x=>`${x.time}\n${JSON.stringify(x.report,null,2)}`).join("\n\n") : "No history";
}
function clearHistory(){
  localStorage.removeItem("orca_history");
  renderHistory();
}

async function timeoutFetch(url,ms=8000){
  const c=new AbortController();
  setTimeout(()=>c.abort(),ms);
  return fetch(url,{signal:c.signal});
}

async function scan(){
  const domain = clean(document.getElementById("target").value);
  if(!domain){ log("Target empty"); return; }
  log("Scan started");
  setProgress(10);

  try{
    const res = await timeoutFetch(PROXY + domain, 10000);
    const body = await res.text();

    lastReport = {
      status: res.status,
      url: res.url,
      headers: Object.fromEntries(res.headers.entries()),
      body: body.slice(0,5000)
    };

    el.output().innerHTML = `<b>Status:</b> ${res.status}<br><b>URL:</b> ${res.url}`;
    el.details().innerHTML = `<b>Body length:</b> ${body.length}`;
    saveHistory(lastReport);

    setProgress(100);
    log("Scan finished");
  } catch (e) {
    setProgress(0);
    el.output().innerHTML = `<b>Scan failed</b>`;
    log("Scan failed (proxy/CORS or offline)");
  }
}

// LAB
function buildUrl(domain,ep,payload){
  const sep = ep.includes("?") ? "&" : "?";
  return PROXY + domain + ep + sep + encodeURIComponent(payload);
}
async function labRun(){
  const domain = clean(document.getElementById("target").value);
  const ep = document.getElementById("labEndpoint").value.trim();
  const payload = document.getElementById("labPayload").value.trim();
  if(!domain||!ep){ el.labOut().textContent="Target+endpoint required"; return; }

  try{
    const res = await timeoutFetch(buildUrl(domain,ep,payload),8000);
    const body = await res.text();
    el.labOut().textContent = `Status:${res.status}\nURL:${res.url}\nBody:\n${body.slice(0,400)}`;
  }catch{
    el.labOut().textContent = "Lab request failed";
  }
}

// Brute (simple)
async function brute(type){
  const domain = clean(document.getElementById("target").value);
  if(!domain){ alert("Target required"); return; }

  if(!bruteState[type].running){
    bruteState[type].running=true;
    bruteState[type].index=0;
    bruteState[type].found=[];
    if(type==="admin") bruteState[type].list=["admin","administrator","login","wp-admin"];
    if(type==="dir") bruteState[type].list=["admin","backup","uploads","config","api"];
    if(type==="sub") bruteState[type].list=["www","api","dev","test","blog"];
  }

  while(bruteState[type].running && bruteState[type].index < bruteState[type].list.length){
    const p = bruteState[type].list[bruteState[type].index++];
    try{
      const res = await timeoutFetch(PROXY + (type==="sub" ? `${p}.${domain}` : `${domain}/${p}`), 4000);
      if(res.status===200) bruteState[type].found.push(p);
    }catch{}
    document.getElementById(type+"Out").textContent =
      `${type.toUpperCase()} Brute\nFound: ${bruteState[type].found.join(", ") || "None"}\nChecked: ${bruteState[type].index}/${bruteState[type].list.length}`;
    await new Promise(r=>setTimeout(r,200));
  }
}

function pause(type){ bruteState[type].running=false; }
function resume(type){ brute(type); }

function exportJSON(){
  if(!lastReport){ alert("No report"); return; }
  const blob = new Blob([JSON.stringify(lastReport,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "report.json";
  a.click();
}

// Events
document.addEventListener("DOMContentLoaded", ()=>{
  renderHistory();
  document.querySelectorAll(".menu button").forEach(b=>{
    b.addEventListener("click", ()=>setTab(b.dataset.tab));
  });

  document.getElementById("scanBtn").addEventListener("click", scan);
  document.getElementById("themeBtn").addEventListener("click", toggleTheme);
  document.getElementById("exportBtn").addEventListener("click", exportJSON);

  document.getElementById("labRunBtn").addEventListener("click", labRun);

  document.getElementById("adminBtn").addEventListener("click", ()=>brute("admin"));
  document.getElementById("pauseAdminBtn").addEventListener("click", ()=>pause("admin"));
  document.getElementById("resumeAdminBtn").addEventListener("click", ()=>resume("admin"));

  document.getElementById("dirBtn").addEventListener("click", ()=>brute("dir"));
  document.getElementById("pauseDirBtn").addEventListener("click", ()=>pause("dir"));
  document.getElementById("resumeDirBtn").addEventListener("click", ()=>resume("dir"));

  document.getElementById("subBtn").addEventListener("click", ()=>brute("sub"));
  document.getElementById("pauseSubBtn").addEventListener("click", ()=>pause("sub"));
  document.getElementById("resumeSubBtn").addEventListener("click", ()=>resume("sub"));

  document.getElementById("clearHistoryBtn").addEventListener("click", clearHistory);
});
</script>
</body>
</html>
