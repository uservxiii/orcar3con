<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORCA WebScan – WordPress LAB (FINAL)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0b1220;--panel:#121a2c;--text:#e9efff;--accent:#4f7cff}
.light{--bg:#f4f6fb;--panel:#ffffff;--text:#0b1220;--accent:#3b6cff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text);display:flex;height:100vh}
.sidebar{width:260px;background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:10px}
.sidebar h2{margin:0}
.sidebar button{padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;cursor:pointer}
.sidebar .ghost{background:transparent;color:var(--text);border:1px solid var(--accent)}
.main{flex:1;padding:24px;overflow:auto}
.card{background:var(--panel);border-radius:18px;padding:18px;margin-bottom:16px}
input{width:100%;padding:12px;border-radius:10px;border:none;margin-bottom:8px}
pre{background:#0a1020;color:#cde;padding:16px;border-radius:14px;white-space:pre-wrap}
.light pre{background:#eef2ff;color:#111}
small{opacity:.7}
</style>
</head>

<body>
<div class="sidebar">
  <h2>🛡️ ORCA</h2>
  <button onclick="scan()">Scan Target</button>
  <button class="ghost" onclick="toggleBrute()">Brute Force LAB</button>
  <button class="ghost" onclick="toggleTheme()">🌗 Theme</button>
</div>

<div class="main">
  <h1>ORCA WebScan – WordPress LAB</h1>

  <div class="card">
    <input id="target" placeholder="https://example.com (ENTER)">
    <small>Passive scan only · LAB SAFE MODE</small>
  </div>

  <div class="card" id="brute" style="display:none">
    <h3>Brute Force LAB (Simulation)</h3>
    <input id="loginUrl" placeholder="/wp-login.php">
    <input id="singleUser" placeholder="Username (optional)">
    <input type="file" id="userWL">
    <input id="singlePass" placeholder="Password (optional)">
    <input type="file" id="passWL">
    <button onclick="runBrute()">Run Simulation</button>
  </div>

  <div class="card">
    <pre id="out">Idle.</pre>
  </div>
</div>

<script>
/* ================= CORE ================= */
const out=t=>document.getElementById("out").textContent=t;
const add=t=>document.getElementById("out").textContent+=t+"\n";
const target=document.getElementById("target");
target.addEventListener("keydown",e=>{if(e.key==="Enter")scan();});

function toggleTheme(){document.body.classList.toggle("light");}
function toggleBrute(){
  const b=document.getElementById("brute");
  b.style.display=b.style.display==="none"?"block":"none";
}
async function fetchSafe(u){
  try{return await fetch(u,{redirect:"manual"});}catch{return null;}
}

/* ================= SCAN ================= */
async function scan(){
  const base=target.value.replace(/\/$/,"");
  if(!base)return;
  out("Scanning...\n");

  const home=await fetchSafe(base);
  if(!home){out("Target unreachable");return;}
  const html=await home.text();

  add("Target");
  add("------");
  add(base+"\n");

  /* SERVER / CDN */
  add("Server / CDN");
  add("------------");
  const server=home.headers.get("server")||"hidden";
  add(server);
  const isCF=!!home.headers.get("cf-ray");
  if(isCF)add("Cloudflare detected");
  add("");

  /* CLOUDFLARE TRACE */
  if(isCF){
    add("Cloudflare Trace");
    add("----------------");
    const t=await fetchSafe(base+"/cdn-cgi/trace");
    if(t){
      (await t.text()).split("\n").forEach(l=>add(l));
    }else add("Blocked");
    add("");
  }

  /* WORDPRESS */
  const isWP=/wp-content|wp-includes/i.test(html);
  add("WordPress");
  add("----------");
  add(isWP?"YES":"NO");
  add("");

  /* ADMIN PATH */
  add("Admin Paths");
  add("-----------");
  for(const p of ["/wp-login.php","/wp-admin/"]){
    const r=await fetchSafe(base+p);
    add(`${p} → ${r?r.status:"blocked"}`);
  }
  add("");

  /* XMLRPC */
  add("XML-RPC");
  add("-------");
  const xr=await fetchSafe(base+"/xmlrpc.php");
  add(xr?xr.status:"blocked");
  add("");

  /* REST USERS */
  let restUsers=[];
  add("Users (REST)");
  add("------------");
  const ru=await fetchSafe(base+"/wp-json/wp/v2/users");
  if(ru&&ru.status===200){
    const d=await ru.json();
    d.forEach(u=>{
      restUsers.push({
        slug:u.slug,
        display:u.name
      });
      add(` - ${u.slug} (Display: ${u.name})`);
    });
  }else add("Protected");
  add("");

  /* AUTHOR ENUM */
  let authorUsers=[];
  add("Author Enum");
  add("-----------");
  for(let i=1;i<=10;i++){
    const a=await fetchSafe(`${base}/?author=${i}`);
    const loc=a?.headers.get("location")||"";
    if(loc.includes("/author/")){
      const slug=loc.split("/author/")[1].split("/")[0];
      authorUsers.push(slug);
      add(`ID ${i} → ${slug}`);
    }
  }
  add("");

  /* AUTO MERGE */
  add("Merged Users (REST + Author)");
  add("-----------------------------");
  restUsers.forEach(u=>{
    const au=authorUsers.find(a=>a.toLowerCase()===u.slug.toLowerCase());
    add(`• ${u.slug}`);
    add(`  Display  : ${u.display}`);
    if(au){
      add(`  Author   : ${au}`);
      add(`  Source   : REST + Author`);
      add(`  Confidence: HIGH`);
    }else{
      add(`  Source   : REST only`);
      add(`  Confidence: MEDIUM`);
    }
    add("");
  });

  add("Scan completed.");
}

/* ================= BRUTE ================= */
let uWL=[],pWL=[];
userWL.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>uWL=r.result.split(/\r?\n/).filter(Boolean);
  r.readAsText(e.target.files[0]);
};
passWL.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>pWL=r.result.split(/\r?\n/).filter(Boolean);
  r.readAsText(e.target.files[0]);
};

function runBrute(){
  const url=loginUrl.value||"/wp-login.php";
  const users=singleUser.value?[singleUser.value]:uWL;
  const pass=singlePass.value?[singlePass.value]:pWL;

  let log=`Brute Force LAB Simulation
--------------------------
Login URL : ${url}
Users     : ${users.length}
Passwords : ${pass.length}

Sample Attempts
---------------
`;

  users.slice(0,1).forEach(u=>{
    pass.slice(0,3).forEach(p=>{
      log+=`POST ${url} | ${u} : ${p}\n`;
    });
  });

  log+=`
Status
------
SAFE MODE
No request sent`;

  out(log);
}
</script>
</body>
</html>
