<head>

<style>

h1 { color:#4fd1c5 }

  background:#1f2933;
  color:#4fd1c5;
  border:1px solid #4fd1c5;

<pre id="output">Ready.</pre>

<script>
const out = msg => {

const reset = () => document.getElementById("output").textContent = "";

function validateRCE(){

  out("--------------");
  out("Mode    : LAB SAFE MODE");

  out("");
}
</script>
